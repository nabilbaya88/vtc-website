<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfert Chauffeur Privé — Réservation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F5F4F0;
    --cream-2: #EBE9E2;
    --white: #FFFFFF;
    --ink: #0B0B0C;
    --ink-dim: #63625E;
    --gold: #F5C518;
    --gold-soft: #FFD84D;
    --bordeaux: #0B0B0C;
    --bordeaux-soft: #262626;
    --line: #0B0B0C;
    --confirm: #17A34A;
    --danger: #E03A2F;
    --radius-lg: 6px;
    --radius-md: 5px;
    --radius-pill: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-width:280px;
  }
  img,svg{max-width:100%;}
  .container{max-width:540px;margin:0 auto;padding:0 20px 40px;position:relative;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:700;margin:0;letter-spacing:-.01em;}
  .eyebrow{
    color:var(--ink);background:var(--gold);display:inline-flex;font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:10px;font-weight:800;padding:4px 10px;border-radius:3px;
  }

  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .step-panel{animation:fadeSlideIn .4s cubic-bezier(.2,.7,.3,1) both;}

  /* LANGUAGE SWITCH */
  .lang-switch{display:flex;gap:3px;background:var(--white);border:2px solid var(--ink);border-radius:var(--radius-pill);padding:3px;flex-shrink:0;}
  .lang-btn{background:none;border:none;font-size:15px;line-height:1;padding:6px 7px;border-radius:3px;cursor:pointer;opacity:.4;filter:grayscale(70%);transition:opacity .2s, filter .2s, background .2s;}
  .lang-btn.active{opacity:1;filter:grayscale(0%);background:var(--gold);}

  /* STICKY TOP BAR */
  .topbar{position:sticky;top:0;z-index:50;background:var(--ink);border-bottom:3px solid var(--gold);}
  .topbar-inner{max-width:540px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:10px 20px;}
  .topbar-text{font-size:12px;color:var(--gold-soft);font-weight:700;display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;text-transform:uppercase;letter-spacing:.02em;}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--confirm);flex-shrink:0;animation:pulse 1.8s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(23,163,74,.5);}
    70%{box-shadow:0 0 0 7px rgba(23,163,74,0);}
    100%{box-shadow:0 0 0 0 rgba(23,163,74,0);}
  }
  .topbar-btn{
    background:var(--gold);color:var(--ink);border:2px solid var(--ink);padding:9px 16px;border-radius:var(--radius-pill);
    font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:'Inter';flex-shrink:0;
    text-transform:uppercase;letter-spacing:.02em;
    transition:transform .15s, background .2s;
  }
  .topbar-btn:hover{background:var(--gold-soft);}
  .topbar-btn:active{transform:scale(.95);}

  /* HERO — vraie photo, traitement bicolore graphique */
  .hero{
    position:relative;
    min-height:80vh;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    background:var(--ink);
  }
  .hero-photo{
    position:absolute;inset:-4% -2%;width:104%;height:110%;object-fit:cover;object-position:center 38%;z-index:0;
    animation:heroZoom 18s ease-out both;
    filter:grayscale(100%) contrast(1.25) brightness(.85);
  }
  @keyframes heroZoom{from{transform:scale(1.08);}to{transform:scale(1);}}
  .hero-overlay{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg, rgba(11,11,12,0.25) 0%, rgba(11,11,12,0.55) 55%, rgba(11,11,12,0.97) 100%);
  }
  .hero-overlay::after{
    content:'';position:absolute;inset:0;background:var(--gold);mix-blend-mode:color;opacity:.55;
  }
  .hero-stripes{
    position:absolute;left:0;right:0;bottom:0;height:14px;z-index:2;
    background:repeating-linear-gradient(-45deg, var(--gold) 0 18px, var(--ink) 18px 36px);
  }
  .hero-inner{max-width:480px;margin:0 auto;padding:64px 24px 40px;position:relative;z-index:2;text-align:center;color:var(--white);}
  .hero .eyebrow{
    opacity:0;animation:fadeUp .7s ease .1s both;
  }
  .hero h1{
    font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;color:var(--white);
    text-transform:uppercase;
  }
  .hero h1 .line{display:block;overflow:hidden;}
  .hero h1 .line span{display:block;opacity:0;transform:translateY(100%);animation:lineUp .7s cubic-bezier(.2,.7,.2,1) forwards;}
  .hero h1 .line:nth-child(1) span{animation-delay:.18s;}
  .hero h1 .line:nth-child(2) span{animation-delay:.30s;}
  @keyframes lineUp{to{opacity:1;transform:translateY(0);}}
  .hero h1 em{color:var(--gold);font-style:normal;}
  .hero .tagline{
    color:rgba(255,255,255,0.78);margin:18px auto 0;font-size:15px;line-height:1.6;max-width:380px;font-weight:500;
    opacity:0;animation:fadeUp .7s ease .45s both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .cta-btn{
    display:inline-flex;align-items:center;gap:8px;margin:26px auto 0;background:var(--gold);
    color:var(--ink);border:3px solid var(--ink);padding:16px 30px;border-radius:var(--radius-pill);font-size:15px;font-weight:800;
    font-family:'Inter';cursor:pointer;box-shadow:6px 6px 0 var(--ink);
    text-transform:uppercase;letter-spacing:.02em;
    transition:transform .15s, box-shadow .15s, background .2s;
    opacity:0;animation:fadeUp .7s ease .6s both;
  }
  .cta-btn:hover{background:var(--gold-soft);transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink);}
  .cta-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .photo-credit{position:absolute;right:10px;bottom:20px;z-index:2;font-size:9px;color:rgba(255,255,255,0.55);}
  .photo-credit a{color:rgba(255,255,255,0.7);}

  /* MARQUEE — bandeau défilant, façon bande de sécurité taxi */
  .marquee{
    background:var(--gold);overflow:hidden;white-space:nowrap;padding:10px 0;
    border-bottom:3px solid var(--ink);border-top:3px solid var(--ink);
  }
  .marquee-track{display:inline-flex;animation:marqueeScroll 20s linear infinite;}
  .marquee-track span{
    display:inline-flex;align-items:center;color:var(--ink);font-size:12.5px;letter-spacing:.03em;
    text-transform:uppercase;font-weight:800;padding:0 20px;
  }
  .marquee-track span::after{content:'●';margin-left:20px;color:var(--ink);font-size:6px;}
  @keyframes marqueeScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* BENTO — grille des points forts, cartes néo-brutalistes */
  .bento{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    margin:0 auto;max-width:540px;padding:26px 20px 0;
  }
  .bento-card{
    background:var(--white);border:2px solid var(--ink);border-radius:var(--radius-lg);
    padding:16px 10px;position:relative;overflow:hidden;box-shadow:4px 4px 0 var(--ink);
    text-align:center;
  }
  .bento-emoji{font-size:26px;line-height:1;margin-bottom:10px;display:block;}
  .bento-title{font-family:'Space Grotesk';font-weight:700;font-size:13px;margin-bottom:4px;text-transform:uppercase;letter-spacing:-.01em;}
  .bento-text{font-size:11px;color:var(--ink-dim);line-height:1.4;}
  .bento-tag{
    display:inline-block;margin-top:10px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink);background:var(--gold);border-radius:3px;padding:3px 8px;font-weight:800;
  }

  /* Reveal au scroll */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1);}
  .reveal.in-view{opacity:1;transform:translateY(0);}

  .toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:26px;flex-wrap:wrap;}
  .toprow h2{font-size:20px;text-transform:uppercase;}
  .ghost-btn{
    background:var(--white);border:2px solid var(--ink);color:var(--ink);
    padding:9px 15px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;font-family:'Inter';cursor:pointer;white-space:nowrap;
    transition:background .15s, transform .15s;
  }
  .ghost-btn:hover{background:var(--gold);}
  .ghost-btn:active{transform:scale(.96);}

  /* ÉCRAN DE RÉSERVATION PLEIN ÉCRAN — façon application */
  @keyframes slideUpScreen{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .booking-overlay{
    position:fixed;inset:0;z-index:200;background:var(--white);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    animation:slideUpScreen .38s cubic-bezier(.2,.8,.3,1) both;
  }
  .app-header{
    position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:3px solid var(--gold);
    display:flex;align-items:center;gap:12px;padding:14px 18px;
  }
  .app-header-title{font-family:'Space Grotesk';font-weight:700;font-size:17px;flex:1;color:var(--white);text-transform:uppercase;}
  .app-header .lang-switch{flex-shrink:0;}

  .card{
    background:var(--white);
    border:none;border-radius:var(--radius-lg);padding:24px;
    box-shadow:none;
    position:relative;z-index:1;overflow:hidden;
  }

  /* STEPPER — cercles connectés, façon app */
  .stepper{display:flex;align-items:center;margin-bottom:26px;}
  .stepper .step-node{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:800;font-family:'Inter';
    background:var(--white);color:var(--ink-dim);
    transition:background .3s, color .3s;
  }
  .stepper .step-node.active{background:var(--ink);color:var(--gold);border-color:var(--ink);}
  .stepper .step-node.done{background:var(--gold);color:var(--ink);}
  .stepper .step-node svg{width:13px;height:13px;}
  .stepper .step-track{flex:1;height:3px;background:var(--cream-2);margin:0 4px;position:relative;overflow:hidden;}
  .stepper .step-track .fill{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .4s ease;}
  .stepper .step-track.done .fill{transform:scaleX(1);}
  .step-label-row{display:flex;justify-content:space-between;margin-top:8px;margin-bottom:22px;}
  .step-label-row span{font-size:10px;color:var(--ink-dim);letter-spacing:.03em;flex:1;text-align:center;text-transform:uppercase;font-weight:700;}
  .step-label-row span:first-child{text-align:left;}
  .step-label-row span:last-child{text-align:right;}
  .step-label-row span.current{color:var(--ink);}

  .section-title{font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-weight:700;text-transform:uppercase;}
  .back-chevron{
    width:34px;height:34px;border-radius:50%;background:var(--white);border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink);
    transition:background .15s;
  }
  .back-chevron:hover{background:var(--gold);}
  .back-chevron svg{width:16px;height:16px;}

  /* CALENDRIER — cases franches, contrastées */
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .month-nav button{
    width:32px;height:32px;border-radius:50%;background:var(--white);border:2px solid var(--ink);color:var(--ink);
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;
  }
  .month-nav button:hover{background:var(--gold);}
  .month-nav .label{font-family:'Space Grotesk';font-weight:700;font-size:16.5px;text-transform:uppercase;letter-spacing:.01em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;}
  .cal-dow{text-align:center;font-size:10px;color:var(--ink-dim);padding-bottom:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:13.5px;font-weight:600;cursor:pointer;position:relative;color:var(--ink);
  }
  .cal-day.empty{cursor:default;}
  .cal-day.past{color:var(--ink-dim);opacity:.3;cursor:default;}
  .cal-day .num{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:background .15s;position:relative;
  }
  .cal-day:not(.empty):not(.past):hover .num{background:var(--cream-2);}
  .cal-day.selected .num{background:var(--ink);color:var(--gold);font-weight:800;}
  .cal-day.today:not(.selected) .num{box-shadow:inset 0 0 0 2px var(--gold);}
  .cal-day .dot{width:4px;height:4px;border-radius:50%;background:var(--ink);position:absolute;bottom:2px;left:50%;transform:translateX(-50%);}
  .cal-day.selected .dot{background:var(--gold);}

  /* Champs avec icône */
  .field{position:relative;}
  .field svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-dim);pointer-events:none;
  }
  .field input{padding-left:38px;}
  .field.has-locate input{padding-right:42px;}
  .field-locate-btn{
    position:absolute;right:5px;top:50%;transform:translateY(-50%);width:30px;height:30px;
    border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:flex;align-items:center;
    justify-content:center;cursor:pointer;pointer-events:auto;transition:background .15s, transform .15s;
  }
  .field-locate-btn:hover{background:var(--gold-soft);}
  .field-locate-btn:active{transform:translateY(-50%) scale(.92);}
  .field-locate-btn svg{position:static;width:15px;height:15px;color:var(--ink);}
  .field-locate-btn.loading svg{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .dt-pill{font-size:14px;}
  .trip-summary-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .trip-summary-row .edit-link{font-size:12.5px;color:var(--ink-dim);text-decoration:underline;cursor:pointer;flex-shrink:0;background:none;border:none;font-family:'Inter';}

  /* Suggestions d'adresses (autocomplétion) */
  .ac-dropdown{
    position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--white);
    border:2px solid var(--ink);border-radius:var(--radius-md);max-height:230px;overflow-y:auto;
    z-index:30;box-shadow:5px 5px 0 var(--ink);
    opacity:0;transform:translateY(-6px);pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .ac-dropdown.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .ac-item{padding:11px 14px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--cream-2);color:var(--ink);line-height:1.4;transition:background .12s;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover{background:var(--gold);}

  @keyframes expandIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .expand-in{animation:expandIn .28s cubic-bezier(.2,.8,.3,1) both;}

  label{display:block;font-size:12.5px;color:var(--ink-dim);margin:16px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
  input, select{
    width:100%;background:var(--white);border:2px solid var(--ink);color:var(--ink);
    padding:13px 14px;border-radius:var(--radius-md);font-family:'Inter';font-size:15px;
  }
  input:focus, select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,24,0.35);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .estimate{
    margin-top:18px;padding:16px;background:var(--cream);border-radius:var(--radius-md);
    border:2px dashed var(--ink);font-size:13.5px;color:var(--ink-dim);
  }
  .estimate .price{color:var(--ink);font-family:'Space Grotesk';font-weight:700;font-size:24px;display:block;margin-top:4px;}
  .primary-btn{
    width:100%;margin-top:22px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);
    padding:16px;border-radius:var(--radius-pill);font-size:15px;font-weight:800;font-family:'Inter';cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);transition:transform .15s, box-shadow .15s, background .2s;
    text-transform:uppercase;letter-spacing:.02em;
  }
  .primary-btn:disabled{background:var(--cream-2);color:var(--ink-dim);box-shadow:none;border-color:var(--line);cursor:not-allowed;}
  .primary-btn:not(:disabled):hover{background:var(--gold-soft);transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink);}
  .primary-btn:not(:disabled):active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .link-btn{
    display:block;width:100%;text-align:center;background:none;border:none;color:var(--ink-dim);
    font-size:13px;margin-top:14px;cursor:pointer;text-decoration:underline;font-family:'Inter';font-weight:600;
  }
  .whatsapp-btn{
    display:block;text-align:center;text-decoration:none;width:100%;margin-top:14px;
    background:var(--confirm);color:#fff;border:3px solid var(--ink);padding:16px;border-radius:var(--radius-pill);font-weight:800;font-size:15px;
    text-transform:uppercase;letter-spacing:.02em;
    box-shadow:5px 5px 0 var(--ink);transition:transform .15s, box-shadow .15s;
  }
  .whatsapp-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .slots-list{margin-top:12px;font-size:13px;color:var(--ink-dim);}
  .slots-list span{display:inline-block;background:var(--cream);border:2px solid var(--ink);padding:3px 9px;border-radius:var(--radius-pill);margin:3px 4px 0 0;font-weight:700;}
  .booking-row{border-bottom:2px dashed var(--line);padding:12px 0;font-size:14px;}
  .booking-row:last-child{border-bottom:none;}
  .booking-row .top{display:flex;justify-content:space-between;color:var(--ink);font-family:'Space Grotesk';font-weight:700;margin-bottom:4px;gap:8px;flex-wrap:wrap;}
  .booking-row .detail{color:var(--ink-dim);font-size:13px;line-height:1.6;}
  .booking-row .del{color:var(--danger);cursor:pointer;font-size:12px;text-decoration:underline;font-weight:700;}
  .status-chip{font-size:9.5px;text-transform:uppercase;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:3px;}
  .status-chip.upcoming{background:var(--gold);color:var(--ink);}
  .status-chip.done{background:var(--cream-2);color:var(--ink-dim);}

  /* ONGLETS CHAUFFEUR */
  .tabs{display:flex;position:relative;margin-top:20px;border-bottom:2px solid var(--ink);}
  .tab-btn{
    flex:1;padding:12px 6px;text-align:center;font-weight:800;text-transform:uppercase;
    font-size:12px;letter-spacing:.02em;background:none;border:none;cursor:pointer;color:var(--ink-dim);
    transition:color .2s;font-family:'Inter';
  }
  .tab-btn.active{color:var(--ink);}
  .tab-btn .count{display:inline-block;margin-left:4px;font-size:10px;opacity:.7;}
  .tab-indicator{position:absolute;bottom:-2px;height:3px;background:var(--gold);transition:left .3s cubic-bezier(.2,.8,.3,1), width .3s cubic-bezier(.2,.8,.3,1);}
  .tab-panel{animation:fadeSlideIn .3s cubic-bezier(.2,.7,.3,1) both;}

  .course-link{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;
    background:var(--ink);color:var(--gold);border:none;padding:11px;border-radius:var(--radius-pill);
    font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;
    text-decoration:none;transition:transform .15s, background .2s;
  }
  .course-link:hover{background:var(--bordeaux-soft,#262626);}
  .course-link:active{transform:scale(.97);}

  .course-stage-label{
    text-align:center;font-size:11px;color:var(--ink-dim);text-transform:uppercase;font-weight:700;
    letter-spacing:.03em;margin-bottom:8px;
  }
  .empty-state{color:var(--ink-dim);font-size:14px;padding:20px 0;text-align:center;}
  .footer-note{margin-top:26px;color:var(--ink-dim);font-size:12px;line-height:1.6;text-align:center;}

  .confirm-icon{
    width:56px;height:56px;border-radius:50%;background:var(--confirm);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  }
  .confirm-icon svg{width:26px;height:26px;color:#fff;}

  /* SUIVI DE COURSE — carte, fiche chauffeur, notation */
  .track-summary{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .track-summary .badge{
    background:var(--gold);color:var(--ink);font-size:10.5px;font-weight:800;text-transform:uppercase;
    padding:4px 9px;border-radius:3px;border:2px solid var(--ink);white-space:nowrap;
  }
  .track-map{
    width:100%;height:260px;border-radius:var(--radius-lg);border:2.5px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);margin-top:16px;overflow:hidden;background:var(--cream-2);
  }
  .track-live-stats{
    display:flex;gap:10px;margin-top:14px;
  }
  .track-live-stats .stat{
    flex:1;background:var(--ink);color:var(--gold);border-radius:var(--radius-md);padding:12px;text-align:center;
  }
  .track-live-stats .stat .num{font-family:'Space Grotesk';font-weight:700;font-size:20px;}
  .track-live-stats .stat .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,0.6);margin-top:2px;}
  .track-waiting{
    text-align:center;padding:20px 10px;color:var(--ink-dim);font-size:13px;line-height:1.6;
  }

  .driver-card{display:flex;align-items:center;gap:14px;}
  .driver-photo, .vehicle-photo{
    width:56px;height:56px;border-radius:50%;border:2.5px solid var(--ink);object-fit:cover;
    background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
  }
  .vehicle-photo{border-radius:var(--radius-md);}
  .driver-card .info{flex:1;}
  .driver-card .name{font-family:'Space Grotesk';font-weight:700;font-size:15px;text-transform:uppercase;}
  .driver-card .sub{font-size:11.5px;color:var(--ink-dim);}

  .driver-legal{
    margin-top:10px;padding:12px 14px;background:var(--cream);border:1px dashed var(--line);border-radius:var(--radius-md);
    font-size:11.5px;color:var(--ink-dim);line-height:1.9;
  }
  .driver-legal span{display:inline-block;min-width:110px;color:var(--ink);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.02em;}
  .driver-legal a{color:var(--ink-dim);}

  .star-rating{display:flex;gap:6px;justify-content:center;margin:16px 0 6px;}

  /* CURSEUR "GLISSER POUR DÉMARRER" */
  .slide-track{
    position:relative;width:100%;height:58px;background:var(--cream-2);border:2px solid var(--ink);
    border-radius:var(--radius-pill);overflow:hidden;user-select:none;touch-action:none;
  }
  .slide-fill{
    position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);pointer-events:none;
  }
  .slide-label{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:13.5px;color:var(--ink);
    pointer-events:none;
  }
  .slide-handle{
    position:absolute;top:3px;left:3px;width:48px;height:48px;border-radius:50%;
    background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center;
    cursor:grab;box-shadow:2px 2px 0 rgba(0,0,0,0.2);transition:transform .05s linear;
  }
  .slide-handle:active{cursor:grabbing;}
  .slide-handle svg{width:20px;height:20px;}
  .slide-track.active .slide-handle{background:var(--confirm);}
  .slide-track.snapping .slide-handle{transition:left .25s ease;}
  .slide-track.snapping .slide-fill{transition:width .25s ease;}
  .star-rating .star{font-size:34px;cursor:pointer;color:var(--cream-2);transition:transform .1s;-webkit-text-stroke:2px var(--ink);}
  .star-rating .star.filled{color:var(--gold);}
  .star-rating .star:active{transform:scale(1.15);}

  /* BOTTOM ACTION BAR */
  .bottom-spacer{height:0;transition:height .3s ease;}
  .bottom-spacer.show{height:92px;}
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:210;
    background:var(--ink);border-top:3px solid var(--gold);padding:14px 20px;
    transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.8,.3,1);
  }
  .bottom-bar.show{transform:translateY(0);}
  .bottom-bar-inner{max-width:540px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .bottom-bar .amount{font-family:'Space Grotesk';font-weight:700;font-size:19px;color:var(--gold);line-height:1.1;}
  .bottom-bar .amount small{display:block;font-size:10.5px;color:rgba(255,255,255,0.55);font-family:'Inter';font-weight:400;letter-spacing:.02em;text-transform:uppercase;}
  .bottom-bar .primary-btn{margin-top:0;width:auto;padding:14px 24px;flex-shrink:0;}

  /* ===== RESPONSIVE ===== */
  @media (max-width:359px){
    .hero-inner{padding:48px 16px 30px;}
    .hero h1{font-size:26px;}
    .container{padding:0 14px 40px;}
    .bento{padding:22px 14px 0;gap:6px;}
    .bento-card{padding:12px 6px;}
    .bento-emoji{font-size:22px;}
    .card{padding:18px;}
    .row2{grid-template-columns:1fr;}
    .cal-day{font-size:12px;}
    .bottom-bar{padding:12px 14px;}
    .bottom-bar .amount{font-size:16px;}
    .bottom-bar .primary-btn{padding:12px 18px;font-size:14px;}
    .topbar-inner{padding:8px 14px;}
    .topbar-text{font-size:11px;}
  }
  @media (min-width:700px){
    .container, .topbar-inner, .bento{max-width:620px;}
    .hero-inner{max-width:540px;}
    .hero h1{font-size:44px;}
    .hero .tagline{font-size:16px;max-width:460px;}
    .card{padding:32px;}
  }
  @media (min-width:1000px){
    .container, .topbar-inner, .bento{max-width:680px;}
    .hero{min-height:82vh;}
  }

function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function fetchViaJsonp(url){
  return new Promise((resolve) => {
    const cbName = 'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const script = document.createElement('script');
    window[cbName] = (data) => { resolve(data); delete window[cbName]; script.remove(); };
    script.src = `${url}${url.includes('?') ? '&' : '?'}callback=${cbName}`;
    script.onerror = () => { resolve([]); delete window[cbName]; script.remove(); };
    document.body.appendChild(script);
  });
}

    body: JSON.stringify(payload)
  }).catch(()=>{});
}

function bookingsOnDate(key){
  return state.bookings.filter(b => b.date === key).sort((a,b)=> a.time.localeCompare(b.time));
}

function buildCalendar(container){
  const y = state.cursorDate.getFullYear();
  const m = state.cursorDate.getMonth();
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const tKey = todayKey();
  const monthNames = MONTHS[state.lang];
  const dowNames = DOW[state.lang];

  let html = `<div class="month-nav">
    <button data-nav="-1">‹</button>
    <div class="label">${monthNames[m]} ${y}</div>
    <button data-nav="1">›</button>
  </div><div class="cal-grid">`;
  dowNames.forEach(d => html += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) html += `<div class="cal-day empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(y,m,day);
    const key = dateKey(d);
    const isPast = key < tKey;
    const count = bookingsOnDate(key).length;
    const isSelected = state.selectedDate === key;
    const isToday = key === tKey;
    html += `<div class="cal-day ${isPast?'past':''} ${isSelected?'selected':''} ${isToday?'today':''}" data-date="${isPast?'':key}">
      <div class="num">${day}</div>${count>0 ? '<div class="dot"></div>' : ''}
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;

  container.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick = () => { state.cursorDate = new Date(y, m + parseInt(btn.dataset.nav), 1); render(); };
  });
  container.querySelectorAll('.cal-day[data-date]').forEach(el=>{
    if(!el.dataset.date) return;
    el.onclick = () => {
      state.selectedDate = el.dataset.date;
      if(state.bookingOpen){ state.bookingStep = 2; }
      render();
    };
  });
}

function estimatePrice(km, min){
  const base = 5;
  let distanceKm = km ? parseFloat(km) : null;
  if(!distanceKm && min){ distanceKm = (parseFloat(min)/60) * 30; }
  if(!distanceKm || isNaN(distanceKm)) return null;
  return (base + distanceKm * 1.5).toFixed(0);
}

// Centre Paris/Île-de-France utilisé pour prioriser les résultats de recherche
const IDF_PROXIMITY = '2.3522,48.8566';
const IDF_BBOX = '1.4,48.1,3.6,49.3'; // limite large de l'Île-de-France (ouest,sud,est,nord)

// Jeton de session Mapbox Search Box (requis par l'API, un par "session" de recherche)
function newSearchSession(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0;
    return (c === 'x' ? r : (r&0x3|0x8)).toString(16);
  });
}

// API Mapbox Search Box — bien meilleure couverture des lieux (gares, aéroports, monuments)
// que l'ancienne API Geocoding, qui ne référence quasiment que les adresses postales.
async function suggestPlaces(query, sessionToken){
  const url = `https://api.mapbox.com/search/searchbox/v1/suggest?q=${encodeURIComponent(query)}&access_token=${MAPBOX_TOKEN}&session_token=${sessionToken}&language=${state.lang}&country=fr&proximity=${IDF_PROXIMITY}&bbox=${IDF_BBOX}&types=poi,address,place,street,neighborhood&limit=6`;
  const res = await fetch(url);
  if(!res.ok){
    let detail = '';
    try{ const errData = await res.json(); detail = errData.message || ''; }catch(e){}
    throw new Error(`HTTP ${res.status}${detail ? ' — ' + detail : ''}`);
  }
  const data = await res.json();
  return (data.suggestions || []).map(s => ({
    id: s.mapbox_id,
    label: s.name + (s.place_formatted ? ' — ' + s.place_formatted : '')
  }));
}

async function retrievePlace(mapboxId, sessionToken){
  const url = `https://api.mapbox.com/search/searchbox/v1/retrieve/${mapboxId}?access_token=${MAPBOX_TOKEN}&session_token=${sessionToken}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('retrieve failed');
  const data = await res.json();
  const feature = data.features && data.features[0];
  if(!feature) throw new Error('no result');
  return {
    address: feature.properties.full_address || feature.properties.name,
    coords: feature.geometry.coordinates // [lon, lat]
  };
}

async function geocodeAddress(query){
  // On utilise d'abord la Search Box API (bien meilleure sur les gares/aéroports)
  try{
    const session = newSearchSession();
    const suggestions = await suggestPlaces(query, session);
    if(suggestions.length){
      const place = await retrievePlace(suggestions[0].id, session);
      if(place.coords) return place.coords;
    }
  }catch(e){ /* on tente le repli ci-dessous */ }

  const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${MAPBOX_TOKEN}&limit=1&country=fr&language=${state.lang}&proximity=${IDF_PROXIMITY}&bbox=${IDF_BBOX}&types=poi,address,place,locality,neighborhood`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('geocode failed');
  const data = await res.json();
  if(!data.features || !data.features.length) throw new Error('no result');
  return data.features[0].center; // [lon, lat]
}

async function reverseGeocode(lon, lat){
  const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${lon},${lat}.json?access_token=${MAPBOX_TOKEN}&language=${state.lang}&limit=1`;
  const res = await fetch(url);
  if(!res.ok){
    let detail = '';
    try{ const errData = await res.json(); detail = errData.message || ''; }catch(e){}
    throw new Error(`HTTP ${res.status}${detail ? ' — ' + detail : ''}`);
  }
  const data = await res.json();
  if(!data.features || !data.features.length) throw new Error('Aucun résultat pour ces coordonnées');
  return data.features[0].place_name;
}

async function fetchAddressSuggestions(query){
  const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${MAPBOX_TOKEN}&autocomplete=true&limit=6&country=fr&language=${state.lang}&proximity=${IDF_PROXIMITY}&bbox=${IDF_BBOX}&types=poi,address,place,locality,neighborhood`;
  const res = await fetch(url);
  if(!res.ok){
    let detail = '';
    try{ const errData = await res.json(); detail = errData.message || ''; }catch(e){}
    throw new Error(`HTTP ${res.status}${detail ? ' — ' + detail : ''}`);
  }
  const data = await res.json();
  return (data.features || []).map(f => f.place_name);
}

function setupAutocomplete(inputId, dropdownId, onSelect){
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  if(!input || !dropdown) return;
  let debounceTimer;
  let sessionToken = newSearchSession();

  const closeDropdown = () => { dropdown.classList.remove('show'); dropdown.innerHTML = ''; };

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = input.value.trim();
    if(query.length < 3 || MAPBOX_TOKEN.includes('COLLEZ_ICI')){ closeDropdown(); return; }
    debounceTimer = setTimeout(async () => {
      try{
        const suggestions = await suggestPlaces(query, sessionToken);
        if(!suggestions.length){ closeDropdown(); return; }
        dropdown.innerHTML = suggestions.map((s, i) =>
          `<div class="ac-item" data-idx="${i}">${s.label}</div>`
        ).join('');
        dropdown.querySelectorAll('.ac-item').forEach((item, i) => {
          item.onclick = async () => {
            closeDropdown();
            try{
              const place = await retrievePlace(suggestions[i].id, sessionToken);
              input.value = place.address;
              sessionToken = newSearchSession(); // nouvelle session après sélection, comme recommandé par Mapbox
              if(onSelect) onSelect(place);
            }catch(e){
              console.error('Retrieve error:', e);
              input.value = suggestions[i].label;
              if(onSelect) onSelect({ address: suggestions[i].label, coords: null });
            }
          };
        });
        dropdown.classList.add('show');
      }catch(e){ console.error('Autocomplete error:', e); closeDropdown(); }
    }, 300);
  });

  document.addEventListener('click', (e) => {
    if(e.target !== input && !dropdown.contains(e.target)) closeDropdown();
  });
}

function locateUser(targetInputId, statusElId, btnEl, onDone){
  const statusEl = document.getElementById(statusElId);
  if(!navigator.geolocation){ statusEl.textContent = t('locationDenied'); return; }
  if(MAPBOX_TOKEN.includes('COLLEZ_ICI')){ statusEl.textContent = t('mapboxNotConfigured'); return; }
  btnEl.classList.add('loading');
  statusEl.textContent = t('locatingUser');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try{
      const address = await reverseGeocode(pos.coords.longitude, pos.coords.latitude);
      document.getElementById(targetInputId).value = address;
      statusEl.textContent = '';
      if(onDone) onDone(address);
    }catch(e){
      statusEl.textContent = `${t('locationError')} (${e.message})`;
      console.error('Reverse geocode error:', e);
    }
    btnEl.classList.remove('loading');
  }, () => {
    statusEl.textContent = t('locationDenied');
    btnEl.classList.remove('loading');
  }, { enableHighAccuracy: true, timeout: 8000 });
}

async function calculateRoute(departAddress, arriveeAddress){
  const [from, to] = await Promise.all([
    geocodeAddress(departAddress),
    geocodeAddress(arriveeAddress)
  ]);
  const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${from[0]},${from[1]};${to[0]},${to[1]}?access_token=${MAPBOX_TOKEN}&overview=false`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('directions failed');
  const data = await res.json();
  if(!data.routes || !data.routes.length) throw new Error('no route');
  const route = data.routes[0];
  return {
    km: (route.distance / 1000).toFixed(1),
    min: Math.round(route.duration / 60)
  };
}

// Trajet complet avec géométrie (pour tracer la ligne sur la carte) entre deux coordonnées [lon,lat]
async function routeBetweenCoords(fromCoord, toCoord){
  const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${fromCoord[0]},${fromCoord[1]};${toCoord[0]},${toCoord[1]}?access_token=${MAPBOX_TOKEN}&geometries=geojson&overview=full`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('directions failed');
  const data = await res.json();
  if(!data.routes || !data.routes.length) throw new Error('no route');
  const route = data.routes[0];
  return {
    km: (route.distance / 1000).toFixed(1),
    min: Math.round(route.duration / 60),
    geometry: route.geometry
  };
}

function buildReceiptDoc(booking){
  const T = I18N[state.lang];
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const left = 48, right = 547;

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(30,25,20);
  doc.text(T.receiptCompany, left, 60);
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(120,111,96);
  doc.text(`${T.receiptTitle} — ${T.receiptRef} ${booking.id}`, left, 78);
  doc.setDrawColor(230,222,201); doc.setLineWidth(1);
  doc.line(left, 92, right, 92);

  const rows = [
    [T.receiptName, booking.name || '—'],
    [T.receiptDate, booking.date],
    [T.receiptTime, booking.time],
    [T.receiptDepart, booking.depart],
    [T.receiptArrivee, booking.arrivee],
    [T.receiptPhone, booking.phone],
    booking.email ? [T.emailLabelShort, booking.email] : null
  ].filter(Boolean);

  let y = 122;
  rows.forEach(([label, val]) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(120,111,96);
    doc.text(label, left, y);
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(34,31,26);
    doc.text(String(val), left, y + 15);
    doc.setDrawColor(240,235,220);
    doc.line(left, y + 24, right, y + 24);
    y += 42;
  });

  if(booking.price){
    y += 6;
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(124,43,47);
    doc.text(`${T.receiptPrice} : ≈ ${booking.price} €`, left, y);
    y += 30;
  }

  const issued = new Date().toLocaleString(state.lang === 'fr' ? 'fr-FR' : 'en-GB');
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120,111,96);
  doc.text(`${T.receiptIssued} ${issued}`, left, y + 16);
  const footerLines = doc.splitTextToSize(T.receiptFooter, right - left);
  doc.text(footerLines, left, y + 32);

  return doc;
}

function downloadReceipt(booking){
  const doc = buildReceiptDoc(booking);
  doc.save(`bon-de-commande-${booking.id}.pdf`);
}

function getReceiptBase64(booking){
  const doc = buildReceiptDoc(booking);
  const dataUri = doc.output('datauristring');
  return dataUri.split(',')[1];
}

async function sendReceiptByEmail(booking, toEmail){
  const T = I18N[state.lang];

  await postToSheet({

    to: toEmail,
    subject: T.emailSubject,
    body: T.receiptFooter,
    filename: `bon-de-commande-${booking.id}.pdf`,

  });

function setupRevealObserver(){
  const els = document.querySelectorAll('.reveal:not(.in-view)');
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){
    els.forEach(el => el.classList.add('in-view'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  els.forEach(el => observer.observe(el));
}

      if(!state.tripDepart || !state.tripArrivee || MAPBOX_TOKEN.includes('COLLEZ_ICI')) return;
      statusEl.textContent = t('searchCalculating');

        const result = (state.tripDepartCoords && state.tripArriveeCoords)
          ? await routeBetweenCoords(state.tripDepartCoords, state.tripArriveeCoords)
          : await calculateRoute(state.tripDepart, state.tripArrivee);
        state.tripKm = result.km;
        statusEl.textContent = '';
        updateEstimate();
      }catch(e){ statusEl.textContent = t('routeError'); }

    const revealDepart = async () => {
      if(departWrap.style.display !== 'none') return;
      departWrap.style.display = 'block';

      if(!state.tripDepart && navigator.geolocation && !MAPBOX_TOKEN.includes('COLLEZ_ICI')){
        statusEl.textContent = t('searchLocating');
        try{
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 8000 });
          });
          state.tripDepart = await reverseGeocode(pos.coords.longitude, pos.coords.latitude);
          sDepart.value = state.tripDepart;
          statusEl.textContent = '';
          await tryCalcRoute();
        }catch(e){ statusEl.textContent = t('searchLocateFailed'); }

    dtPillBtn.onclick = () => {

    if(sDepart){

    };
  }

let trackRefreshInterval = null;
let trackMapInstance = null;

function stopTrackRefresh(){
  if(trackRefreshInterval){ clearInterval(trackRefreshInterval); trackRefreshInterval = null; }
  trackMapInstance = null;
}

function isBookingPast(b){
  try{
    const dt = new Date(`${b.date}T${(b.time||'00:00')}:00`);
    return dt.getTime() < Date.now();
  }catch(e){ return false; }
}

function driverPhotoHTML(){

    : `<div class="driver-photo">🧑‍✈️</div>`;
}
function vehiclePhotoHTML(){

    ? `<img class="vehicle-photo" src="${VEHICLE_PHOTO_URL}" alt="Véhicule">`
    : `<div class="vehicle-photo">🚘</div>`;
}

async function refreshLiveTracking(booking){
  const statEl = document.getElementById('trackStats');
  const waitEl = document.getElementById('trackWaitingMsg');
  const mapEl = document.getElementById('trackMap');
  try{
    const pos = await fetchDriverPosition();
    if(!pos){ if(waitEl){ waitEl.style.display = ''; waitEl.textContent = t('trackWaitingLive'); } if(mapEl) mapEl.style.display = 'none'; return; }
    const ageMin = (Date.now() - new Date(pos.updatedAt).getTime()) / 60000;
    if(ageMin > 30){ if(waitEl){ waitEl.style.display = ''; waitEl.textContent = t('trackWaitingLive'); } if(mapEl) mapEl.style.display = 'none'; return; }

    const pickupCoord = await geocodeAddress(booking.depart);
    const driverCoord = [pos.lng, pos.lat];
    const route = await routeBetweenCoords(driverCoord, pickupCoord);

    if(waitEl) waitEl.style.display = 'none';
    if(mapEl) mapEl.style.display = '';

    if(statEl){
      statEl.innerHTML = `
        <div class="stat"><div class="num">${route.km}</div><div class="lbl">${t('trackKmLeft')}</div></div>
        <div class="stat"><div class="num">${route.min}</div><div class="lbl">${t('trackMinLeft')}</div></div>
      `;
    }

    if(!trackMapInstance){
      trackMapInstance = new mapboxgl.Map({
        container: 'trackMap',
        style: 'mapbox://styles/mapbox/streets-v12',
        accessToken: MAPBOX_TOKEN,
        center: driverCoord,
        zoom: 12
      });
      trackMapInstance.on('load', () => {
        trackMapInstance.addSource('route', { type: 'geojson', data: { type:'Feature', geometry: route.geometry } });
        trackMapInstance.addLayer({ id:'route', type:'line', source:'route',
          paint: { 'line-color': '#F5C518', 'line-width': 5, 'line-opacity': 0.9 } });
        new mapboxgl.Marker({ color:'#0B0B0C' }).setLngLat(pickupCoord).addTo(trackMapInstance);
        trackMapInstance.driverMarker = new mapboxgl.Marker({ color:'#F5C518' }).setLngLat(driverCoord).addTo(trackMapInstance);
        const bounds = new mapboxgl.LngLatBounds(driverCoord, driverCoord).extend(pickupCoord);
        trackMapInstance.fitBounds(bounds, { padding: 50 });
      });
      // Corrige un bug classique de Mapbox GL : la carte peut se dessiner en blanc/coupée
      // si son conteneur n'avait pas encore sa taille définitive au moment de la création
      // (fréquent sur tablette/PC où la mise en page se stabilise différemment que sur mobile).
      setTimeout(() => trackMapInstance && trackMapInstance.resize(), 150);
      window.addEventListener('resize', () => { if(trackMapInstance) trackMapInstance.resize(); });
    } else {
      trackMapInstance.resize();
      trackMapInstance.driverMarker.setLngLat(driverCoord);
      if(trackMapInstance.getSource('route')){
        trackMapInstance.getSource('route').setData({ type:'Feature', geometry: route.geometry });
      }
    }
  }catch(e){ if(waitEl){ waitEl.style.display = ''; } }
}

function renderStars(container, currentValue){
  container.innerHTML = [1,2,3,4,5].map(n =>
    `<span class="star ${n <= currentValue ? 'filled' : ''}" data-val="${n}">★</span>`
  ).join('');
}

          <div><span>${t('legalSiret')}</span>${COMPANY_SIRET}</div>
          <div><span>${t('legalVehicle')}</span>${VEHICLE_MODEL} — ${VEHICLE_PLATE}</div>

          <div><span>${t('legalEmail')}</span><a href="mailto:${DRIVER_EMAIL}">${DRIVER_EMAIL}</a></div>
        </div>

        ${!past ? `
          <div id="trackMap" class="track-map" style="display:none;"></div>
          <div class="track-live-stats" id="trackStats"></div>
          <div id="trackWaitingMsg" class="track-waiting">${t('trackWaitingLive')}</div>
        ` : ''}

        ${past ? `
          <div class="roadline" style="margin:22px 0 6px;"></div>
          ${booking.rating ? `
            <div style="text-align:center;">
              <div class="star-rating">${[1,2,3,4,5].map(n=>`<span class="star ${n<=booking.rating?'filled':''}">★</span>`).join('')}</div>
              <div style="font-size:12.5px;color:var(--ink-dim);">${t('trackRateThanks')}</div>
            </div>
          ` : `
            <div style="text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:14px;text-transform:uppercase;">${t('trackRateTitle')}</div>
            <div class="star-rating" id="starRating"></div>
            <button class="primary-btn" id="submitRatingBtn" disabled>${t('trackRateSubmit')}</button>
            <div id="rateStatus" style="text-align:center;font-size:12px;color:var(--ink-dim);margin-top:8px;"></div>
          `}
        ` : ''}
      </div>` : ''}
    </div>
  `;
  bindLangSwitch();
  stopTrackRefresh();

  document.getElementById('back').onclick = () => {
    stopTrackRefresh();
    history.replaceState(null, '', window.location.pathname);
    state.view = 'client'; state.trackResults = null; render();
  };

  document.getElementById('trackSearchBtn').onclick = async () => {
    const ref = document.getElementById('trackRef').value.trim();
    const statusEl = document.getElementById('trackStatus');
    if(!ref) return;
    if(APPS_SCRIPT_URL.includes('COLLEZ_ICI')){ statusEl.textContent = t('trackNotConfigured'); return; }
    statusEl.textContent = t('trackSearching');
    try{
      const rows = await fetchViaJsonp(APPS_SCRIPT_URL);
      const normalize = s => (s || '').toString().trim().toLowerCase();
      const matches = (rows || []).filter(r => normalize(r.id) === normalize(ref));
      state.trackResults = matches.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
      statusEl.textContent = '';
      render();
    }catch(e){
      statusEl.textContent = t('trackNoResults');
    }
  };

  if(state.pendingTrackRef && !booking){
    state.pendingTrackRef = null;
    document.getElementById('trackSearchBtn').click();
  }

  if(booking && !past){
    if(APPS_SCRIPT_URL.includes('COLLEZ_ICI') || MAPBOX_TOKEN.includes('COLLEZ_ICI')){
      const waitEl = document.getElementById('trackWaitingMsg');
      if(waitEl) waitEl.textContent = t('trackNotConfigured');
    } else {
      refreshLiveTracking(booking);
      trackRefreshInterval = setInterval(() => refreshLiveTracking(booking), 15000);
    }
  }

  if(booking && past && !booking.rating){
    let selected = 0;
    const starEl = document.getElementById('starRating');
    renderStars(starEl, 0);
    starEl.querySelectorAll('.star').forEach(star => {
      star.onclick = () => {
        selected = parseInt(star.dataset.val);
        renderStars(starEl, selected);
        starEl.querySelectorAll('.star').forEach(s => { s.onclick = star.onclick; });
        document.getElementById('submitRatingBtn').disabled = false;
      };
    });
    document.getElementById('submitRatingBtn').onclick = async () => {
      const rateStatus = document.getElementById('rateStatus');
      if(APPS_SCRIPT_URL.includes('COLLEZ_ICI')){ rateStatus.textContent = t('trackNotConfigured'); return; }
      await postToSheet({ action: 'rate', id: booking.id, rating: selected });
      booking.rating = selected;
      render();
    };
  }
}

let driverCourseMapInstance = null;

function setupThreeStageSlider(onComplete){
  const slideTrack = document.getElementById('courseSlideTrack');
  const slideFill = document.getElementById('courseSlideFill');
  const slideHandle = document.getElementById('courseSlideHandle');
  const handleSize = 48, margin = 3;
  let dragging = false, startX = 0;

  function setPos(x, animate){
    slideTrack.classList.toggle('snapping', !!animate);
    slideHandle.style.left = x + 'px';
    slideFill.style.width = (x + handleSize + margin) + 'px';
  }
  function reset(){ slideTrack.classList.remove('active'); setPos(margin, true); }
  setPos(margin, false);

  slideHandle.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX;
    slideTrack.classList.remove('snapping');
    slideHandle.setPointerCapture(e.pointerId);
  });
  slideHandle.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const maxLeft = slideTrack.offsetWidth - handleSize - margin;
    let newLeft = margin + (e.clientX - startX);
    newLeft = Math.max(margin, Math.min(maxLeft, newLeft));
    setPos(newLeft, false);
  });
  const endDrag = () => {
    if(!dragging) return;
    dragging = false;
    const maxLeft = slideTrack.offsetWidth - handleSize - margin;
    const current = parseFloat(slideHandle.style.left) || margin;
    if(current >= maxLeft * 0.82){
      setPos(maxLeft, true);
      slideTrack.classList.add('active');
      onComplete(reset);
    } else {
      reset();
    }
  };
  slideHandle.addEventListener('pointerup', endDrag);
  slideHandle.addEventListener('pointercancel', endDrag);
}

function renderDriverCourse(){
  const app = document.getElementById('app');
  const booking = state.bookings.find(b => b.id === state.driverCourseId);

  if(!booking){
    state.view = 'driver'; render(); return;
  }

  const status = booking.status || 'pending';
  const stageInfo = {
    pending:     { label: t('stagePickup'),    tag: t('stageLabelPending') },
    to_pickup:   { label: t('stageStartRide'), tag: t('stageLabelToPickup') },
    in_progress: { label: t('stageEndRide'),   tag: t('stageLabelInProgress') },
    completed:   { label: '',                  tag: t('stageLabelCompleted') }
  }[status] || { label: t('stagePickup'), tag: t('stageLabelPending') };

  app.innerHTML = `
    <div class="container" style="padding-top:28px;">
      <div class="toprow" style="padding-top:0;">
        <h2>${t('courseTitle')}</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          ${renderLangSwitch()}
          <button class="ghost-btn" id="back">${t('back')}</button>
        </div>
      </div>

      <div class="card" style="margin-top:18px;">
        <div class="section-title" style="margin-bottom:10px;">
          ${booking.name ? `👤 ${booking.name}<br>` : ''}
        </div>
        <div class="detail" style="font-size:13px;">
          📞 <a href="tel:${booking.phone}" style="color:inherit;">${booking.phone}</a><br>
          ${t('from')} : ${booking.depart}<br>
          ${t('to')} : ${booking.arrivee}<br>
          ${t('onDate')} ${booking.date} · ${booking.time}
          ${booking.price ? `<br>${t('estimateLabel')} : ${booking.price} €` : ''}
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <div class="course-stage-label">${stageInfo.tag}</div>
        <div id="courseMap" class="track-map" style="margin-bottom:16px;"></div>
        <div id="courseStats" style="display:flex;gap:10px;margin-bottom:16px;"></div>

        ${status === 'completed' ? `
          <div style="text-align:center;color:var(--ink-dim);font-size:13px;">${t('courseCompletedNote')}</div>
        ` : `
          <div class="slide-track" id="courseSlideTrack">
            <div class="slide-fill" id="courseSlideFill"></div>
            <div class="slide-label" id="courseSlideLabel">${stageInfo.label}</div>
            <div class="slide-handle" id="courseSlideHandle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </div>
          </div>
          <div id="courseSlideStatus" style="font-size:12.5px;color:var(--ink-dim);margin-top:10px;min-height:14px;text-align:center;"></div>
        `}
      </div>
    </div>
  `;

  bindLangSwitch();
  document.getElementById('back').onclick = () => {
    state.view = 'driver'; render();
  };

  // Carte : position du chauffeur (mise à jour en direct) + trajet vers la cible actuelle
  const targetAddress = status === 'in_progress' ? booking.arrivee : booking.depart;

  async function initOrUpdateCourseMap(driverCoord){
    try{
      const targetCoord = await geocodeAddress(targetAddress);
      const route = await routeBetweenCoords(driverCoord, targetCoord);
      const statsEl = document.getElementById('courseStats');
      if(statsEl){
        statsEl.innerHTML = `
          <div class="stat"><div class="num">${route.km}</div><div class="lbl">${t('trackKmLeft')}</div></div>
          <div class="stat"><div class="num">${route.min}</div><div class="lbl">${t('trackMinLeft')}</div></div>
        `;
      }
      if(!driverCourseMapInstance){
        driverCourseMapInstance = new mapboxgl.Map({
          container: 'courseMap',
          style: 'mapbox://styles/mapbox/streets-v12',
          accessToken: MAPBOX_TOKEN,
          center: driverCoord,
          zoom: 12
        });
        driverCourseMapInstance.on('load', () => {
          driverCourseMapInstance.addSource('route', { type:'geojson', data:{ type:'Feature', geometry: route.geometry } });
          driverCourseMapInstance.addLayer({ id:'route', type:'line', source:'route',
            paint:{ 'line-color':'#F5C518', 'line-width':5, 'line-opacity':0.9 } });
          new mapboxgl.Marker({ color:'#0B0B0C' }).setLngLat(targetCoord).addTo(driverCourseMapInstance);
          driverCourseMapInstance.driverMarker = new mapboxgl.Marker({ color:'#F5C518' }).setLngLat(driverCoord).addTo(driverCourseMapInstance);
          const bounds = new mapboxgl.LngLatBounds(driverCoord, driverCoord).extend(targetCoord);
          driverCourseMapInstance.fitBounds(bounds, { padding: 50 });
        });
        setTimeout(() => driverCourseMapInstance && driverCourseMapInstance.resize(), 150);
      } else {
        driverCourseMapInstance.resize();
        driverCourseMapInstance.driverMarker.setLngLat(driverCoord);
        if(driverCourseMapInstance.getSource('route')){
          driverCourseMapInstance.getSource('route').setData({ type:'Feature', geometry: route.geometry });
        }
      }
    }catch(e){ /* géocodage/itinéraire indisponible pour le moment */ }
  }

  if(status !== 'completed' && !MAPBOX_TOKEN.includes('COLLEZ_ICI')){
    if(navigator.geolocation){
      if(state.geoWatchId !== null){ navigator.geolocation.clearWatch(state.geoWatchId); state.geoWatchId = null; }
      state.geoWatchId = navigator.geolocation.watchPosition((pos) => {
        const coord = [pos.coords.longitude, pos.coords.latitude];
        postToSheet({ action: 'updatePosition', lat: pos.coords.latitude, lng: pos.coords.longitude, updatedAt: new Date().toISOString() });
        initOrUpdateCourseMap(coord);
      }, () => { /* localisation refusée : la carte restera vide */ }, { enableHighAccuracy: true, maximumAge: 8000, timeout: 15000 });
    }
  }

  if(status === 'completed') return;

  const nextStatusMap = { pending: 'to_pickup', to_pickup: 'in_progress', in_progress: 'completed' };

  setupThreeStageSlider(async (resetFn) => {
    const newStatus = nextStatusMap[status];
    booking.status = newStatus;
    await postToSheet({ action: 'updateStatus', id: booking.id, status: newStatus });
    const statusEl = document.getElementById('courseSlideStatus');

    if(newStatus === 'completed'){
      if(state.geoWatchId !== null){ navigator.geolocation.clearWatch(state.geoWatchId); state.geoWatchId = null; }
      driverCourseMapInstance = null;
      if(statusEl) statusEl.textContent = t('courseCompletedNote');
      setTimeout(() => { state.view = 'driver'; state.driverCourseId = null; render(); }, 1200);
    } else {
      render();
    }
  });
}

function isBookingCompleted(b){
  if(b.status === 'completed') return true;
  try{
    const dt = new Date(`${b.date}T${(b.time||'00:00')}:00`);
    return (Date.now() - dt.getTime()) > 12 * 60 * 60 * 1000; // 12h passées
  }catch(e){ return false; }
}

  const app = document.getElementById('app');
  const all = [...state.bookings];
  const completedList = all.filter(isBookingCompleted).sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));

        ${b.name ? `👤 ${b.name}<br>` : ''}
        🎫 ${b.id}<br>

        ${t('to')} : ${b.arrivee}

    </div>`;

  app.innerHTML = `
    <div class="container" style="padding-top:28px;">
      <div class="toprow" style="padding-top:0;">
        <div>
          <div class="eyebrow" style="margin-bottom:4px;">${t('driverView')}</div>
          <h2>${t('myCalendar')}</h2>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          ${renderLangSwitch()}
          <button class="ghost-btn" id="back">${t('backClient')}</button>
        </div>
      </div>

      <div class="tabs" id="driverTabs">
        <button class="tab-btn ${tab==='upcoming'?'active':''}" data-tab="upcoming">${t('tabUpcoming')} <span class="count">(${upcomingList.length})</span></button>
        <button class="tab-btn ${tab==='completed'?'active':''}" data-tab="completed">${t('tabCompleted')} <span class="count">(${completedList.length})</span></button>
        <div class="tab-indicator" id="tabIndicator"></div>
      </div>

      <div class="card tab-panel" style="margin-top:16px;" id="driverListCard">
        ${list.length ? list.map(rowHTML).join('') : `<div class="empty-state">${t('noBooking')}</div>`}
      </div>
    </div>
  `;

  bindLangSwitch();
  document.getElementById('back').onclick = () => { history.replaceState(null, '', window.location.pathname); state.view='client'; state.selectedDate=null; state.bookingStep=1; render(); };

  const tabsEl = document.getElementById('driverTabs');
  const indicator = document.getElementById('tabIndicator');
  const positionIndicator = () => {
    const activeBtn = tabsEl.querySelector('.tab-btn.active');
    if(activeBtn){ indicator.style.left = activeBtn.offsetLeft + 'px'; indicator.style.width = activeBtn.offsetWidth + 'px'; }
  };
  requestAnimationFrame(positionIndicator);
  tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => { state.driverTab = btn.dataset.tab; render(); };
  });

  app.querySelectorAll('[data-course-id]').forEach(btn => {
    btn.onclick = () => { state.driverCourseId = btn.dataset.courseId; state.view = 'driver-course'; render(); };
  });

  app.querySelectorAll('.del').forEach(el => {
    el.onclick = async () => {
      if(!confirm(t('confirmDelete'))) return;
      state.bookings = state.bookings.filter(b => b.id !== el.dataset.id);
      await postToSheet({ action: 'delete', id: el.dataset.id });
      render();
    };
  });
}

function render(){
  const existingOverlay = document.getElementById('bookingOverlay');
  if(existingOverlay) existingOverlay.remove();
  const existingBar = document.getElementById('bottomBar');
  if(existingBar) existingBar.remove();

  if(state.view === 'client') renderClient();
  else if(state.view === 'track') renderTrack();
  else if(state.view === 'account') renderAccount();
  else if(state.view === 'driver-login') renderDriverLogin();
  else if(state.view === 'driver') renderDriver();
  else if(state.view === 'driver-course') renderDriverCourse();
}

function checkSecretAccess(){
  if(window.location.hash.toLowerCase() === '#admin'){ state.view = 'driver-login'; }
}
checkSecretAccess();
loadBookings();
