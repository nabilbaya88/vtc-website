<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfert Chauffeur Privé — Réservation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F5F4F0;
    --cream-2: #EBE9E2;
    --white: #FFFFFF;
    --ink: #0B0B0C;
    --ink-dim: #63625E;
    --gold: #F5C518;
    --gold-soft: #FFD84D;
    --bordeaux: #0B0B0C;
    --bordeaux-soft: #262626;
    --line: #0B0B0C;
    --confirm: #17A34A;
    --danger: #E03A2F;
    --radius-lg: 6px;
    --radius-md: 5px;
    --radius-pill: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-width:280px;
  }
  img,svg{max-width:100%;}
  .container{max-width:540px;margin:0 auto;padding:0 20px 40px;position:relative;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:700;margin:0;letter-spacing:-.01em;}
  .eyebrow{
    color:var(--ink);background:var(--gold);display:inline-flex;font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:10px;font-weight:800;padding:4px 10px;border-radius:3px;
  }

  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .step-panel{animation:fadeSlideIn .4s cubic-bezier(.2,.7,.3,1) both;}

  /* LANGUAGE SWITCH */
  .lang-switch{display:flex;gap:3px;background:var(--white);border:2px solid var(--ink);border-radius:var(--radius-pill);padding:3px;flex-shrink:0;}
  .lang-btn{background:none;border:none;font-size:15px;line-height:1;padding:6px 7px;border-radius:3px;cursor:pointer;opacity:.4;filter:grayscale(70%);transition:opacity .2s, filter .2s, background .2s;}
  .lang-btn.active{opacity:1;filter:grayscale(0%);background:var(--gold);}

  /* STICKY TOP BAR */
  .topbar{position:sticky;top:0;z-index:50;background:var(--ink);border-bottom:3px solid var(--gold);}
  .topbar-inner{max-width:540px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:10px 20px;}
  .topbar-text{font-size:12px;color:var(--gold-soft);font-weight:700;display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;text-transform:uppercase;letter-spacing:.02em;}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--confirm);flex-shrink:0;animation:pulse 1.8s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(23,163,74,.5);}
    70%{box-shadow:0 0 0 7px rgba(23,163,74,0);}
    100%{box-shadow:0 0 0 0 rgba(23,163,74,0);}
  }
  .topbar-btn{
    background:var(--gold);color:var(--ink);border:2px solid var(--ink);padding:9px 16px;border-radius:var(--radius-pill);
    font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:'Inter';flex-shrink:0;
    text-transform:uppercase;letter-spacing:.02em;
    transition:transform .15s, background .2s;
  }
  .topbar-btn:hover{background:var(--gold-soft);}
  .topbar-btn:active{transform:scale(.95);}

  /* HERO — vraie photo, traitement bicolore graphique */
  .hero{
    position:relative;
    min-height:80vh;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    background:var(--ink);
  }
  .hero-photo{
    position:absolute;inset:-4% -2%;width:104%;height:110%;object-fit:cover;object-position:center 45%;z-index:0;
    animation:heroZoom 18s ease-out both;
    filter:brightness(.82) saturate(1.05);
  }
  @keyframes heroZoom{from{transform:scale(1.08);}to{transform:scale(1);}}
  .hero-overlay{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg, rgba(11,11,12,0.15) 0%, rgba(11,11,12,0.45) 55%, rgba(11,11,12,0.95) 100%);
  }
  .hero-overlay::after{
    content:'';position:absolute;inset:0;background:var(--gold);mix-blend-mode:color;opacity:0;
  }
  .hero-stripes{
    position:absolute;left:0;right:0;bottom:0;height:14px;z-index:2;
    background:repeating-linear-gradient(-45deg, var(--gold) 0 18px, var(--ink) 18px 36px);
  }
  .hero-inner{max-width:480px;margin:0 auto;padding:64px 24px 40px;position:relative;z-index:2;text-align:center;color:var(--white);}
  .hero .eyebrow{
    opacity:0;animation:fadeUp .7s ease .1s both;
  }
  .hero h1{
    font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;color:var(--white);
    text-transform:uppercase;
  }
  .hero h1 .line{display:block;overflow:hidden;}
  .hero h1 .line span{display:block;opacity:0;transform:translateY(100%);animation:lineUp .7s cubic-bezier(.2,.7,.2,1) forwards;}
  .hero h1 .line:nth-child(1) span{animation-delay:.18s;}
  .hero h1 .line:nth-child(2) span{animation-delay:.30s;}
  @keyframes lineUp{to{opacity:1;transform:translateY(0);}}
  .hero h1 em{color:var(--gold);font-style:normal;}
  .hero .tagline{
    color:rgba(255,255,255,0.78);margin:18px auto 0;font-size:15px;line-height:1.6;max-width:380px;font-weight:500;
    opacity:0;animation:fadeUp .7s ease .45s both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .cta-btn{
    display:inline-flex;align-items:center;gap:8px;margin:26px auto 0;background:var(--gold);
    color:var(--ink);border:3px solid var(--ink);padding:16px 30px;border-radius:var(--radius-pill);font-size:15px;font-weight:800;
    font-family:'Inter';cursor:pointer;box-shadow:6px 6px 0 var(--ink);
    text-transform:uppercase;letter-spacing:.02em;
    transition:transform .15s, box-shadow .15s, background .2s;
    opacity:0;animation:fadeUp .7s ease .6s both;
  }
  .cta-btn:hover{background:var(--gold-soft);transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink);}
  .cta-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .photo-credit{position:absolute;right:10px;bottom:20px;z-index:2;font-size:9px;color:rgba(255,255,255,0.55);}
  .photo-credit a{color:rgba(255,255,255,0.7);}

  /* MARQUEE — bandeau défilant, façon bande de sécurité taxi */
  .marquee{
    background:var(--gold);overflow:hidden;white-space:nowrap;padding:10px 0;
    border-bottom:3px solid var(--ink);border-top:3px solid var(--ink);
  }
  .marquee-track{display:inline-flex;animation:marqueeScroll 20s linear infinite;}
  .marquee-track span{
    display:inline-flex;align-items:center;color:var(--ink);font-size:12.5px;letter-spacing:.03em;
    text-transform:uppercase;font-weight:800;padding:0 20px;
  }
  .marquee-track span::after{content:'●';margin-left:20px;color:var(--ink);font-size:6px;}
  @keyframes marqueeScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* BENTO — grille des points forts, cartes néo-brutalistes */
  .bento{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    margin:0 auto;max-width:540px;padding:26px 20px 0;
  }
  .bento-card{
    background:var(--white);border:2px solid var(--ink);border-radius:var(--radius-lg);
    padding:16px 10px;position:relative;overflow:hidden;box-shadow:4px 4px 0 var(--ink);
    text-align:center;
  }
  .bento-emoji{font-size:26px;line-height:1;margin-bottom:10px;display:block;}
  .bento-title{font-family:'Space Grotesk';font-weight:700;font-size:13px;margin-bottom:4px;text-transform:uppercase;letter-spacing:-.01em;}
  .bento-text{font-size:11px;color:var(--ink-dim);line-height:1.4;}
  .bento-tag{
    display:inline-block;margin-top:10px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink);background:var(--gold);border-radius:3px;padding:3px 8px;font-weight:800;
  }

  /* Reveal au scroll */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1);}
  .reveal.in-view{opacity:1;transform:translateY(0);}

  .toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:26px;flex-wrap:wrap;}
  .toprow h2{font-size:20px;text-transform:uppercase;}
  .ghost-btn{
    background:var(--white);border:2px solid var(--ink);color:var(--ink);
    padding:9px 15px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;font-family:'Inter';cursor:pointer;white-space:nowrap;
    transition:background .15s, transform .15s;
  }
  .ghost-btn:hover{background:var(--gold);}
  .ghost-btn:active{transform:scale(.96);}

  /* ÉCRAN DE RÉSERVATION PLEIN ÉCRAN — façon application */
  @keyframes slideUpScreen{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .booking-overlay{
    position:fixed;inset:0;z-index:200;background:var(--white);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    animation:slideUpScreen .38s cubic-bezier(.2,.8,.3,1) both;
  }
  .app-header{
    position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:3px solid var(--gold);
    display:flex;align-items:center;gap:12px;padding:14px 18px;
  }
  .app-header-title{font-family:'Space Grotesk';font-weight:700;font-size:17px;flex:1;color:var(--white);text-transform:uppercase;}
  .app-header .lang-switch{flex-shrink:0;}

  .card{
    background:var(--white);
    border:none;border-radius:var(--radius-lg);padding:24px;
    box-shadow:none;
    position:relative;z-index:1;overflow:hidden;
  }

  /* STEPPER — cercles connectés, façon app */
  .stepper{display:flex;align-items:center;margin-bottom:26px;}
  .stepper .step-node{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:800;font-family:'Inter';
    background:var(--white);color:var(--ink-dim);
    transition:background .3s, color .3s;
  }
  .stepper .step-node.active{background:var(--ink);color:var(--gold);border-color:var(--ink);}
  .stepper .step-node.done{background:var(--gold);color:var(--ink);}
  .stepper .step-node svg{width:13px;height:13px;}
  .stepper .step-track{flex:1;height:3px;background:var(--cream-2);margin:0 4px;position:relative;overflow:hidden;}
  .stepper .step-track .fill{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .4s ease;}
  .stepper .step-track.done .fill{transform:scaleX(1);}
  .step-label-row{display:flex;justify-content:space-between;margin-top:8px;margin-bottom:22px;}
  .step-label-row span{font-size:10px;color:var(--ink-dim);letter-spacing:.03em;flex:1;text-align:center;text-transform:uppercase;font-weight:700;}
  .step-label-row span:first-child{text-align:left;}
  .step-label-row span:last-child{text-align:right;}
  .step-label-row span.current{color:var(--ink);}

  .section-title{font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-weight:700;text-transform:uppercase;}
  .back-chevron{
    width:34px;height:34px;border-radius:50%;background:var(--white);border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink);
    transition:background .15s;
  }
  .back-chevron:hover{background:var(--gold);}
  .back-chevron svg{width:16px;height:16px;}

  /* CALENDRIER — cases franches, contrastées */
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .month-nav button{
    width:32px;height:32px;border-radius:50%;background:var(--white);border:2px solid var(--ink);color:var(--ink);
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;
  }
  .month-nav button:hover{background:var(--gold);}
  .month-nav .label{font-family:'Space Grotesk';font-weight:700;font-size:16.5px;text-transform:uppercase;letter-spacing:.01em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;}
  .cal-dow{text-align:center;font-size:10px;color:var(--ink-dim);padding-bottom:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:13.5px;font-weight:600;cursor:pointer;position:relative;color:var(--ink);
  }
  .cal-day.empty{cursor:default;}
  .cal-day.past{color:var(--ink-dim);opacity:.3;cursor:default;}
  .cal-day .num{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:background .15s;position:relative;
  }
  .cal-day:not(.empty):not(.past):hover .num{background:var(--cream-2);}
  .cal-day.selected .num{background:var(--ink);color:var(--gold);font-weight:800;}
  .cal-day.today:not(.selected) .num{box-shadow:inset 0 0 0 2px var(--gold);}
  .cal-day .dot{width:4px;height:4px;border-radius:50%;background:var(--ink);position:absolute;bottom:2px;left:50%;transform:translateX(-50%);}
  .cal-day.selected .dot{background:var(--gold);}

  /* Champs avec icône */
  .field{position:relative;}
  .field svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-dim);pointer-events:none;
  }
  .field input{padding-left:38px;}
  .field.has-locate input{padding-right:42px;}
  .field-locate-btn{
    position:absolute;right:5px;top:50%;transform:translateY(-50%);width:30px;height:30px;
    border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:flex;align-items:center;
    justify-content:center;cursor:pointer;pointer-events:auto;transition:background .15s, transform .15s;
  }
  .field-locate-btn:hover{background:var(--gold-soft);}
  .field-locate-btn:active{transform:translateY(-50%) scale(.92);}
  .field-locate-btn svg{position:static;width:15px;height:15px;color:var(--ink);}
  .field-locate-btn.loading svg{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .dt-pill{font-size:14px;}
  .trip-summary-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .trip-summary-row .edit-link{font-size:12.5px;color:var(--ink-dim);text-decoration:underline;cursor:pointer;flex-shrink:0;background:none;border:none;font-family:'Inter';}

  /* Suggestions d'adresses (autocomplétion) */
  .ac-dropdown{
    position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--white);
    border:2px solid var(--ink);border-radius:var(--radius-md);max-height:230px;overflow-y:auto;
    z-index:30;box-shadow:5px 5px 0 var(--ink);
    opacity:0;transform:translateY(-6px);pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .ac-dropdown.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .ac-item{padding:11px 14px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--cream-2);color:var(--ink);line-height:1.4;transition:background .12s;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover{background:var(--gold);}

  @keyframes expandIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .expand-in{animation:expandIn .28s cubic-bezier(.2,.8,.3,1) both;}

  label{display:block;font-size:12.5px;color:var(--ink-dim);margin:16px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
  input, select{
    width:100%;background:var(--white);border:2px solid var(--ink);color:var(--ink);
    padding:13px 14px;border-radius:var(--radius-md);font-family:'Inter';font-size:15px;
  }
  input:focus, select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,24,0.35);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .estimate{
    margin-top:18px;padding:16px;background:var(--cream);border-radius:var(--radius-md);
    border:2px dashed var(--ink);font-size:13.5px;color:var(--ink-dim);
  }
  .estimate .price{color:var(--ink);font-family:'Space Grotesk';font-weight:700;font-size:24px;display:block;margin-top:4px;}
  .primary-btn{
    width:100%;margin-top:22px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);
    padding:16px;border-radius:var(--radius-pill);font-size:15px;font-weight:800;font-family:'Inter';cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);transition:transform .15s, box-shadow .15s, background .2s;
    text-transform:uppercase;letter-spacing:.02em;
  }
  .primary-btn:disabled{background:var(--cream-2);color:var(--ink-dim);box-shadow:none;border-color:var(--line);cursor:not-allowed;}
  .primary-btn:not(:disabled):hover{background:var(--gold-soft);transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink);}
  .primary-btn:not(:disabled):active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .link-btn{
    display:block;width:100%;text-align:center;background:none;border:none;color:var(--ink-dim);
    font-size:13px;margin-top:14px;cursor:pointer;text-decoration:underline;font-family:'Inter';font-weight:600;
  }
  .whatsapp-btn{
    display:block;text-align:center;text-decoration:none;width:100%;margin-top:14px;
    background:var(--confirm);color:#fff;border:3px solid var(--ink);padding:16px;border-radius:var(--radius-pill);font-weight:800;font-size:15px;
    text-transform:uppercase;letter-spacing:.02em;
    box-shadow:5px 5px 0 var(--ink);transition:transform .15s, box-shadow .15s;
  }
  .whatsapp-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .slots-list{margin-top:12px;font-size:13px;color:var(--ink-dim);}
  .slots-list span{display:inline-block;background:var(--cream);border:2px solid var(--ink);padding:3px 9px;border-radius:var(--radius-pill);margin:3px 4px 0 0;font-weight:700;}
  .booking-row{border-bottom:2px dashed var(--line);padding:12px 0;font-size:14px;}
  .booking-row:last-child{border-bottom:none;}
  .booking-row .top{display:flex;justify-content:space-between;color:var(--ink);font-family:'Space Grotesk';font-weight:700;margin-bottom:4px;gap:8px;flex-wrap:wrap;}
  .booking-row .detail{color:var(--ink-dim);font-size:13px;line-height:1.6;}
  .booking-row .del{color:var(--danger);cursor:pointer;font-size:12px;text-decoration:underline;font-weight:700;}
  .status-chip{font-size:9.5px;text-transform:uppercase;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:3px;}
  .status-chip.upcoming{background:var(--gold);color:var(--ink);}
  .status-chip.done{background:var(--cream-2);color:var(--ink-dim);}

  /* ONGLETS CHAUFFEUR */
  .tabs{display:flex;position:relative;margin-top:20px;border-bottom:2px solid var(--ink);}
  .tab-btn{
    flex:1;padding:12px 6px;text-align:center;font-weight:800;text-transform:uppercase;
    font-size:12px;letter-spacing:.02em;background:none;border:none;cursor:pointer;color:var(--ink-dim);
    transition:color .2s;font-family:'Inter';
  }
  .tab-btn.active{color:var(--ink);}
  .tab-btn .count{display:inline-block;margin-left:4px;font-size:10px;opacity:.7;}
  .tab-indicator{position:absolute;bottom:-2px;height:3px;background:var(--gold);transition:left .3s cubic-bezier(.2,.8,.3,1), width .3s cubic-bezier(.2,.8,.3,1);}
  .tab-panel{animation:fadeSlideIn .3s cubic-bezier(.2,.7,.3,1) both;}

  .course-link{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;
    background:var(--ink);color:var(--gold);border:none;padding:11px;border-radius:var(--radius-pill);
    font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;
    text-decoration:none;transition:transform .15s, background .2s;
  }
  .course-link:hover{background:var(--bordeaux-soft,#262626);}
  .course-link:active{transform:scale(.97);}

  .course-stage-label{
    text-align:center;font-size:11px;color:var(--ink-dim);text-transform:uppercase;font-weight:700;
    letter-spacing:.03em;margin-bottom:8px;
  }
  .empty-state{color:var(--ink-dim);font-size:14px;padding:20px 0;text-align:center;}
  .footer-note{margin-top:26px;color:var(--ink-dim);font-size:12px;line-height:1.6;text-align:center;}

  /* MENU CHAUFFEUR — barre de navigation basse */
  .driver-shell{padding-bottom:90px;}
  .logout-btn{
    width:38px;height:38px;border-radius:50%;background:var(--white);border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--danger);flex-shrink:0;
    transition:background .15s;
  }
  .logout-btn:hover{background:var(--cream-2);}
  .logout-btn svg{width:17px;height:17px;}

  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--ink);border-top:3px solid var(--gold);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .bottom-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
    background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.5);font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.02em;font-family:'Inter';transition:color .2s;
  }
  .bottom-nav-item svg{width:22px;height:22px;}
  .bottom-nav-item.active{color:var(--gold);}

  .sub-tab-icon{width:14px;height:14px;vertical-align:-2px;margin-right:3px;}

  .profile-photo-row{display:flex;gap:18px;margin-bottom:6px;flex-wrap:wrap;}
  .channel-choice{display:flex;gap:10px;margin:4px 0 14px;}
  .channel-choice label{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 10px;border:2.5px solid var(--ink);border-radius:var(--radius-md);cursor:pointer;font-weight:700;font-size:13.5px;background:#fff;}
  .channel-choice input{position:absolute;opacity:0;pointer-events:none;}
  .channel-choice label:has(input:checked){background:var(--ink);color:var(--yellow,#f5c518);}
  .channel-choice label:has(input:focus-visible){outline:3px solid var(--yellow,#f5c518);outline-offset:2px;}
  input[readonly]{opacity:.75;cursor:not-allowed;}
  .photo-slot{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .profile-photo-row .driver-photo,.profile-photo-row .vehicle-photo{width:92px;height:92px;font-size:34px;}
  .photo-actions{display:flex;gap:10px;align-items:center;font-size:12.5px;}
  .photo-actions input[type=file]{display:none;}
  .photo-actions label{margin:0;cursor:pointer;text-decoration:underline;font-weight:600;color:var(--ink);}
  .photo-actions button{background:none;border:0;padding:0;font:inherit;color:var(--danger);text-decoration:underline;cursor:pointer;}
  .profile-save-status{font-size:12.5px;color:var(--ink-dim);margin-top:10px;min-height:14px;text-align:center;}

  .help-item{border-bottom:1px dashed var(--line);padding:14px 0;}
  .help-item:last-child{border-bottom:none;}
  .help-item .q{font-family:'Space Grotesk';font-weight:700;font-size:14px;margin-bottom:6px;}
  .help-item .a{font-size:13px;color:var(--ink-dim);line-height:1.6;}

  .stat{flex:1;background:var(--cream);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px;text-align:center;}
  .stat .num{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:var(--ink);}
  .stat .lbl{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.02em;margin-top:2px;}

  .accept-btn{display:block;width:100%;margin-top:10px;background:var(--confirm);color:#fff;border:3px solid var(--ink);padding:12px;border-radius:var(--radius-pill);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;box-shadow:4px 4px 0 var(--ink);font-family:'Inter';}
  .accept-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .accept-btn:disabled{opacity:.6;cursor:wait;}
  .status-chip.toconfirm{background:var(--danger);color:#fff;}
  .accept-result{background:var(--white);border:3px solid var(--ink);border-radius:var(--radius-lg);padding:16px;margin-top:16px;box-shadow:5px 5px 0 var(--confirm);}
  .accept-result-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;}
  .accept-result-line{font-size:12.5px;color:var(--ink-dim);margin-top:6px;line-height:1.5;}
  .doc-links{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;}
  .doc-pending{margin-top:10px;font-size:12px;color:var(--ink-dim);font-style:italic;line-height:1.5;}
  .link-inline{background:none;border:none;padding:0;color:var(--ink-dim);text-decoration:underline;cursor:pointer;font-size:12.5px;font-family:'Inter';font-weight:600;}
  .link-inline:hover{color:var(--ink);}
  input[readonly]{background:var(--cream-2);color:var(--ink-dim);}
  .map-back-btn svg{width:18px;height:18px;}
  .track-waiting-full{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:0 34px;color:rgba(255,255,255,0.75);font-size:14px;line-height:1.6;
  }
  .map-driver-mini{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:#fff;}
  .map-driver-mini .driver-photo,.map-driver-mini .vehicle-photo{width:44px;height:44px;font-size:20px;flex-shrink:0;}
  .map-driver-mini .nm{font-family:'Space Grotesk';font-weight:700;font-size:14px;text-transform:uppercase;}
  .map-driver-mini .sub{font-size:11px;color:rgba(255,255,255,0.65);}

  /* CARTE PLEIN ÉCRAN — page de suivi de course */
  .fullscreen-map-wrap{
    position:fixed;inset:0;z-index:150;background:var(--ink);
  }
  .fullscreen-map-wrap .track-map{width:100%;height:100%;margin:0;border-radius:0;border:none;background:#1b1b1d;}
  .fullscreen-map-overlay-top{
    position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 40px;
    background:linear-gradient(180deg, rgba(11,11,12,0.85), rgba(11,11,12,0));
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .fullscreen-map-overlay-bottom{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:36px 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg, rgba(11,11,12,0.92), rgba(11,11,12,0));
  }
  .map-back-btn{
    width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.5);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--white);flex-shrink:0;
  }
  .map-stage-pill{
    background:var(--gold);color:var(--ink);font-size:11px;font-weight:800;text-transform:uppercase;
    letter-spacing:.02em;padding:6px 14px;border-radius:var(--radius-pill);
  }
  .map-stats-row{display:flex;gap:10px;margin-bottom:14px;}
  .map-stats-row .stat{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);}
  .map-stats-row .stat .num{color:var(--gold);}
  .map-stats-row .stat .lbl{color:rgba(255,255,255,0.6);}
  .map-quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .map-quick-actions a{
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:9.5px;
    background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);border-radius:var(--radius-md);
    color:var(--white);text-decoration:none;font-weight:700;text-transform:uppercase;
  }

  .confirm-icon{
    width:56px;height:56px;border-radius:50%;background:var(--confirm);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  }
  .confirm-icon svg{width:26px;height:26px;color:#fff;}

  /* SUIVI DE COURSE — carte, fiche chauffeur, notation */
  .track-summary{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .track-summary .badge{
    background:var(--gold);color:var(--ink);font-size:10.5px;font-weight:800;text-transform:uppercase;
    padding:4px 9px;border-radius:3px;border:2px solid var(--ink);white-space:nowrap;
  }
  .track-map{
    width:100%;height:260px;border-radius:var(--radius-lg);border:2.5px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);margin-top:16px;overflow:hidden;background:var(--cream-2);
  }
  .track-live-stats{
    display:flex;gap:10px;margin-top:14px;
  }
  .track-live-stats .stat{
    flex:1;background:var(--ink);color:var(--gold);border-radius:var(--radius-md);padding:12px;text-align:center;
  }
  .track-live-stats .stat .num{font-family:'Space Grotesk';font-weight:700;font-size:20px;}
  .track-live-stats .stat .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,0.6);margin-top:2px;}
  .track-waiting{
    text-align:center;padding:20px 10px;color:var(--ink-dim);font-size:13px;line-height:1.6;
  }

  .driver-card{display:flex;align-items:center;gap:14px;}
  .driver-photo, .vehicle-photo{
    width:56px;height:56px;border-radius:50%;border:2.5px solid var(--ink);object-fit:cover;
    background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
  }
  .vehicle-photo{border-radius:var(--radius-md);}
  .driver-card .info{flex:1;}
  .driver-card .name{font-family:'Space Grotesk';font-weight:700;font-size:15px;text-transform:uppercase;}
  .driver-card .sub{font-size:11.5px;color:var(--ink-dim);}

  .driver-legal{
    margin-top:10px;padding:12px 14px;background:var(--cream);border:1px dashed var(--line);border-radius:var(--radius-md);
    font-size:11.5px;color:var(--ink-dim);line-height:1.9;
  }
  .driver-legal div{display:flex;gap:10px;align-items:baseline;}
  .driver-legal span{display:inline-block;flex:0 0 96px;min-width:96px;color:var(--ink);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.02em;}
  .driver-legal a{color:var(--ink-dim);}

  .star-rating{display:flex;gap:6px;justify-content:center;margin:16px 0 6px;}

  /* CURSEUR "GLISSER POUR DÉMARRER" */
  .slide-track{
    position:relative;width:100%;height:58px;background:var(--cream-2);border:2px solid var(--ink);
    border-radius:var(--radius-pill);overflow:hidden;user-select:none;touch-action:none;
  }
  .slide-fill{
    position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);pointer-events:none;
  }
  .slide-label{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:13.5px;color:var(--ink);
    pointer-events:none;
  }
  .slide-handle{
    position:absolute;top:3px;left:3px;width:48px;height:48px;border-radius:50%;
    background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center;
    cursor:grab;box-shadow:2px 2px 0 rgba(0,0,0,0.2);transition:transform .05s linear;
  }
  .slide-handle:active{cursor:grabbing;}
  .slide-handle svg{width:20px;height:20px;}
  .slide-track.active .slide-handle{background:var(--confirm);}
  .slide-track.snapping .slide-handle{transition:left .25s ease;}
  .slide-track.snapping .slide-fill{transition:width .25s ease;}
  .star-rating .star{font-size:34px;cursor:pointer;color:var(--cream-2);transition:transform .1s;-webkit-text-stroke:2px var(--ink);}
  .star-rating .star.filled{color:var(--gold);}
  .star-rating .star:active{transform:scale(1.15);}

  /* BOTTOM ACTION BAR */
  .bottom-spacer{height:0;transition:height .3s ease;}
  .bottom-spacer.show{height:92px;}
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:210;
    background:var(--ink);border-top:3px solid var(--gold);padding:14px 20px;
    transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.8,.3,1);
  }
  .bottom-bar.show{transform:translateY(0);}
  .bottom-bar-inner{max-width:540px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .bottom-bar .amount{font-family:'Space Grotesk';font-weight:700;font-size:19px;color:var(--gold);line-height:1.1;}
  .bottom-bar .amount small{display:block;font-size:10.5px;color:rgba(255,255,255,0.55);font-family:'Inter';font-weight:400;letter-spacing:.02em;text-transform:uppercase;}
  .bottom-bar .primary-btn{margin-top:0;width:auto;padding:14px 24px;flex-shrink:0;}

  /* ===== RESPONSIVE ===== */
  @media (max-width:359px){
    .hero-inner{padding:48px 16px 30px;}
    .hero h1{font-size:26px;}
    .container{padding:0 14px 40px;}
    .bento{padding:22px 14px 0;gap:6px;}
    .bento-card{padding:12px 6px;}
    .bento-emoji{font-size:22px;}
    .card{padding:18px;}
    .row2{grid-template-columns:1fr;}
    .cal-day{font-size:12px;}
    .bottom-bar{padding:12px 14px;}
    .bottom-bar .amount{font-size:16px;}
    .bottom-bar .primary-btn{padding:12px 18px;font-size:14px;}
    .topbar-inner{padding:8px 14px;}
    .topbar-text{font-size:11px;}
  }
  @media (min-width:700px){
    .container, .topbar-inner, .bento{max-width:620px;}
    .hero-inner{max-width:540px;}
    .hero h1{font-size:44px;}
    .hero .tagline{font-size:16px;max-width:460px;}
    .card{padding:32px;}
  }
  @media (min-width:1000px){
    .container, .topbar-inner, .bento{max-width:680px;}
    .hero{min-height:82vh;}
  }
</style>

function t(key){ return I18N[state.lang][key]; }
function pad(n){ return n.toString().padStart(2,'0'); }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayKey(){ return dateKey(new Date()); }

// ===== Session (connexion persistante) =====
const SESSION_KEY = 'vtc_session_v1';
const LANG_KEY = 'vtc_lang';

function readSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){ return null; } }
function writeSession(){
  try{
    if(!state.session){ localStorage.removeItem(SESSION_KEY); return; }
    state.session.nav = {
      view: state.view,
      driverSection: state.driverSection, driverTab: state.driverTab,
      driverCourseId: state.driverCourseId, driverCourseTab: state.driverCourseTab,
      clientSection: state.clientSection, clientTab: state.clientTab,
      trackBookingId: state.trackBookingId, trackTab: state.trackTab
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(state.session));
  }catch(e){}
}
function restoreSession(){
  const s = readSession();
  if(!s || (s.role !== 'driver' && s.role !== 'client') || !s.token) return; // anciennes sessions sans jeton : reconnexion
  state.session = s;
  const n = s.nav || {};
  ['driverSection','driverTab','driverCourseId','driverCourseTab','clientSection','clientTab','trackBookingId','trackTab'].forEach(k => {
    if(n[k] !== undefined && n[k] !== null) state[k] = n[k];
  });
  if(s.role === 'driver'){
    state.view = ['driver','driver-course'].includes(n.view) ? n.view : 'driver';
  } else {
    state.view = ['account','track','client'].includes(n.view) ? n.view : 'account';
  }
}
function restoreLang(){
  try{
    const l = localStorage.getItem(LANG_KEY);

// Même logique côté site et côté script Google : chiffres uniquement, 0033 / 33 -> 0
function normPhone(s){
  let d = String(s || '').replace(/\D/g, '');
  if(d.indexOf('0033') === 0) d = '0' + d.slice(4);
  else if(d.indexOf('33') === 0 && d.length === 11) d = '0' + d.slice(2);
  return d;
}
// Neutralise les caractères permettant d'injecter du HTML dans les données reçues de la feuille
function cleanText(v){
  return typeof v === 'string' ? v.replace(/</g,'‹').replace(/>/g,'›').replace(/"/g,'”').replace(/`/g,"'") : v;
}
function cleanObj(o){
  const out = {};
  Object.keys(o || {}).forEach(k => { out[k] = cleanText(o[k]); });
  return out;
}
function escAttr(v){
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function apiGet(params){

  const tok = authToken();
  const res = await fetchViaJsonp(`${APPS_SCRIPT_URL}?${q}${tok ? '&token=' + encodeURIComponent(tok) : ''}`);

function fetchViaJsonp(url){
  return new Promise((resolve) => {
    const cbName = 'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const script = document.createElement('script');
    let done = false;
    const finish = (value) => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
      resolve(value);
    };
    const timer = setTimeout(() => finish(null), 15000); // évite un chargement infini
    window[cbName] = (data) => finish(data);
    script.src = `${url}${url.includes('?') ? '&' : '?'}callback=${cbName}`;
    script.onerror = () => finish(null);
    document.body.appendChild(script);
  });
}

function buildCalendar(container){
  const y = state.cursorDate.getFullYear();
  const m = state.cursorDate.getMonth();
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const tKey = todayKey();
  const monthNames = MONTHS[state.lang];
  const dowNames = DOW[state.lang];

  let html = `<div class="month-nav">
    <button data-nav="-1">‹</button>
    <div class="label">${monthNames[m]} ${y}</div>
    <button data-nav="1">›</button>
  </div><div class="cal-grid">`;
  dowNames.forEach(d => html += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) html += `<div class="cal-day empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(y,m,day);
    const key = dateKey(d);
    const isPast = key < tKey;
    const count = bookingsOnDate(key).length;
    const isSelected = state.selectedDate === key;
    const isToday = key === tKey;
    html += `<div class="cal-day ${isPast?'past':''} ${isSelected?'selected':''} ${isToday?'today':''}" data-date="${isPast?'':key}">
      <div class="num">${day}</div>${count>0 ? '<div class="dot"></div>' : ''}
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;

  container.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick = () => { state.cursorDate = new Date(y, m + parseInt(btn.dataset.nav), 1); render(); };
  });
  container.querySelectorAll('.cal-day[data-date]').forEach(el=>{
    if(!el.dataset.date) return;
    el.onclick = () => {
      state.selectedDate = el.dataset.date;
      if(state.bookingOpen){ state.bookingStep = 2; }
      render();
    };
  });
}

function estimatePrice(km, min){

  let distanceKm = km ? parseFloat(km) : null;
  if(!distanceKm && min){ distanceKm = (parseFloat(min)/60) * 30; }
  if(!distanceKm || isNaN(distanceKm)) return null;
  return (base + distanceKm * 1.5).toFixed(0);
}

// Centre Paris/Île-de-France utilisé pour prioriser les résultats de recherche (lat,lng — format HERE)
const IDF_AT = '48.8566,2.3522';
const HERE_LANG = () => (state.lang === 'fr' ? 'fr' : 'en');

// API HERE Autosuggest — bonne couverture des lieux (gares, aéroports, monuments)
// Retourne directement l'adresse ET les coordonnées, sans étape de "retrieve" séparée.
async function suggestPlaces(query){
  const url = `https://autosuggest.search.hereapi.com/v1/autosuggest?apikey=${HERE_API_KEY}&q=${encodeURIComponent(query)}&at=${IDF_AT}&in=countryCode:FRA&limit=6&lang=${HERE_LANG()}`;
  const res = await fetch(url);
  if(!res.ok){
    let detail = '';
    try{ const errData = await res.json(); detail = errData.title || ''; }catch(e){}
    throw new Error(`HTTP ${res.status}${detail ? ' — ' + detail : ''}`);
  }
  const data = await res.json();
  return (data.items || [])
    .filter(it => it.position || (it.access && it.access[0]))
    .map(it => {
      const pos = it.position || it.access[0];
      const addressLabel = (it.address && it.address.label) ? it.address.label : it.title;
      return { id: it.id, label: addressLabel, address: addressLabel, coords: [pos.lng, pos.lat] };
    });
}

async function geocodeAddress(query){
  // On tente d'abord Autosuggest (meilleure couverture gares/aéroports/lieux)
  try{
    const suggestions = await suggestPlaces(query);
    if(suggestions.length && suggestions[0].coords) return suggestions[0].coords;
  }catch(e){ /* on tente le repli ci-dessous */ }

  const url = `https://geocode.search.hereapi.com/v1/geocode?apikey=${HERE_API_KEY}&q=${encodeURIComponent(query)}&at=${IDF_AT}&in=countryCode:FRA&limit=1&lang=${HERE_LANG()}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('geocode failed');
  const data = await res.json();
  if(!data.items || !data.items.length) throw new Error('no result');
  const pos = data.items[0].position;
  return [pos.lng, pos.lat]; // [lon, lat]
}

async function reverseGeocode(lon, lat){
  const url = `https://revgeocode.search.hereapi.com/v1/revgeocode?apikey=${HERE_API_KEY}&at=${lat},${lon}&limit=1&lang=${HERE_LANG()}`;
  const res = await fetch(url);
  if(!res.ok){
    let detail = '';
    try{ const errData = await res.json(); detail = errData.title || ''; }catch(e){}
    throw new Error(`HTTP ${res.status}${detail ? ' — ' + detail : ''}`);
  }
  const data = await res.json();
  if(!data.items || !data.items.length) throw new Error('Aucun résultat pour ces coordonnées');
  return data.items[0].address.label;
}

function setupAutocomplete(inputId, dropdownId, onSelect){
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  if(!input || !dropdown) return;
  let debounceTimer;

  const closeDropdown = () => { dropdown.classList.remove('show'); dropdown.innerHTML = ''; };

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = input.value.trim();
    if(query.length < 3 || HERE_API_KEY.includes('COLLEZ_ICI')){ closeDropdown(); return; }
    debounceTimer = setTimeout(async () => {
      try{
        const suggestions = await suggestPlaces(query);
        if(!suggestions.length){ closeDropdown(); return; }
        dropdown.innerHTML = suggestions.map((s, i) =>
          `<div class="ac-item" data-idx="${i}">${s.label}</div>`
        ).join('');
        dropdown.querySelectorAll('.ac-item').forEach((item, i) => {
          item.onclick = () => {
            closeDropdown();
            input.value = suggestions[i].address;
            if(onSelect) onSelect(suggestions[i]);
          };
        });
        dropdown.classList.add('show');
      }catch(e){ console.error('Autocomplete error:', e); closeDropdown(); }
    }, 300);
  });

  document.addEventListener('click', (e) => {
    if(e.target !== input && !dropdown.contains(e.target)) closeDropdown();
  });
}

function locateUser(targetInputId, statusElId, btnEl, onDone){
  const statusEl = document.getElementById(statusElId);
  if(!navigator.geolocation){ statusEl.textContent = t('locationDenied'); return; }
  if(HERE_API_KEY.includes('COLLEZ_ICI')){ statusEl.textContent = t('mapboxNotConfigured'); return; }
  btnEl.classList.add('loading');
  statusEl.textContent = t('locatingUser');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try{
      const address = await reverseGeocode(pos.coords.longitude, pos.coords.latitude);
      document.getElementById(targetInputId).value = address;
      statusEl.textContent = '';
      if(onDone) onDone(address);
    }catch(e){
      statusEl.textContent = `${t('locationError')} (${e.message})`;
      console.error('Reverse geocode error:', e);
    }
    btnEl.classList.remove('loading');
  }, () => {
    statusEl.textContent = t('locationDenied');
    btnEl.classList.remove('loading');
  }, { enableHighAccuracy: true, timeout: 8000 });
}

async function calculateRoute(departAddress, arriveeAddress){
  const [from, to] = await Promise.all([
    geocodeAddress(departAddress),
    geocodeAddress(arriveeAddress)
  ]);
  return routeBetweenCoords(from, to);
}

// Trajet complet (avec tracé encodé "flexible polyline") entre deux coordonnées [lon,lat]
async function routeBetweenCoords(fromCoord, toCoord){
  const origin = `${fromCoord[1]},${fromCoord[0]}`;
  const dest = `${toCoord[1]},${toCoord[0]}`;
  const url = `https://router.hereapi.com/v8/routes?transportMode=car&origin=${origin}&destination=${dest}&return=summary,polyline&apikey=${HERE_API_KEY}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('directions failed');
  const data = await res.json();
  if(!data.routes || !data.routes.length) throw new Error('no route');
  const section = data.routes[0].sections[0];
  return {
    km: (section.summary.length / 1000).toFixed(1),
    min: Math.round(section.summary.duration / 60),
    polyline: section.polyline
  };
}

// ===== Documents : bon de commande (réservation préalable VTC) et facture — normes françaises =====
const FR_TZ = 'Europe/Paris';

function fmtMoney(n){ return (Math.round(n * 100) / 100).toFixed(2).replace('.', ',') + ' €'; }
function fmtDateFR(d){
  if(!d) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)){ const p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  const dt = new Date(d);
  return isNaN(dt) ? String(d) : dt.toLocaleDateString('fr-FR', { timeZone: FR_TZ });
}
function fmtDateTimeFR(iso){
  const dt = new Date(iso);
  if(!iso || isNaN(dt)) return '';
  return dt.toLocaleDateString('fr-FR', { timeZone: FR_TZ }) + ' à ' +
         dt.toLocaleTimeString('fr-FR', { timeZone: FR_TZ, hour: '2-digit', minute: '2-digit' });
}
function siteUrl(){
  return (location.origin && location.origin !== 'null') ? location.origin + location.pathname : location.href;
}
function toIntlPhone(p){
  let d = String(p || '').replace(/\D/g, '');
  if(d.indexOf('00') === 0) d = d.slice(2);
  else if(d.charAt(0) === '0') d = '33' + d.slice(1);
  return d;
}

// Prix : le prix du site est un prix TTC. Décomposition HT / TVA 10 % (transport de personnes) ou franchise en base.
function priceBreakdown(b, issuer){
  const ttc = parseFloat(b.price);
  if(isNaN(ttc)) return null;
  if(issuer.vatRegime === 'franchise') return { ttc, ht: ttc, tva: 0, rate: 0, franchise: true };
  const ht = Math.round(ttc / 1.10 * 100) / 100;
  return { ttc, ht, tva: Math.round((ttc - ht) * 100) / 100, rate: 10, franchise: false };
}

function pdfNew(){ const { jsPDF } = window.jspdf; return new jsPDF({ unit: 'pt', format: 'a4' }); }

function pdfHeader(doc, issuer, title, number, dateLabel, dateValue){
  const L = 40, R = 555, y0 = 50;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(20);
  doc.text(doc.splitTextToSize(issuer.company || issuer.name || 'Chauffeur VTC', 300), L, y0);

  const raw = [];
  if(issuer.company && issuer.name) raw.push('Chauffeur : ' + issuer.name);
  if(issuer.legalForm) raw.push('Forme juridique : ' + issuer.legalForm);
  if(issuer.address) raw.push(issuer.address);
  if(issuer.siret) raw.push('SIRET : ' + issuer.siret);
  if(issuer.vatNumber) raw.push('N° TVA intracommunautaire : ' + issuer.vatNumber);
  if(issuer.vtcRegistry) raw.push('Inscription au registre VTC : ' + issuer.vtcRegistry);
  if(issuer.vtcCard) raw.push('Carte professionnelle VTC : ' + issuer.vtcCard);
  if(issuer.phone) raw.push('Tél. : ' + issuer.phone);
  if(issuer.email) raw.push('E-mail : ' + issuer.email);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(70);
  const lines = [];
  raw.forEach(ln => doc.splitTextToSize(ln, 300).forEach(x => lines.push(x)));
  lines.forEach((ln, i) => doc.text(ln, L, y0 + 16 + i * 12));

  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(20);
  doc.text(title, R, y0, { align: 'right' });
  doc.setFontSize(10);
  doc.text('N° ' + number, R, y0 + 20, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(70);
  doc.text(dateLabel + ' ' + dateValue, R, y0 + 34, { align: 'right' });

  const bottom = y0 + 16 + Math.max(lines.length, 3) * 12;
  doc.setDrawColor(200); doc.setLineWidth(0.8); doc.line(L, bottom + 8, R, bottom + 8);
  return bottom + 30;
}

function pdfSection(doc, y, title, rows){
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(20);
  doc.text(title.toUpperCase(), 40, y);
  doc.setDrawColor(225); doc.setLineWidth(0.6); doc.line(40, y + 4, 555, y + 4);

// BON DE COMMANDE = justificatif de réservation préalable (VTC)
function buildOrderDoc(b){
  const issuer = issuerOf(b, 'order');
  const doc = pdfNew();
  let y = pdfHeader(doc, issuer, 'BON DE COMMANDE', b.orderNo || '—', 'Émis le', fmtDateTimeFR(b.orderDate));

  y = pdfSection(doc, y, 'Client', [
    ['Nom', b.name || '—'],
    ['Téléphone', b.phone],
    ['E-mail', b.email]
  ]);
  y = pdfSection(doc, y, 'Réservation préalable', [
    ['Référence de réservation', b.id],
    ['Réservation effectuée le', fmtDateTimeFR(b.createdAt)],
    ['Date et heure de prise en charge', fmtDateFR(b.date) + ' à ' + b.time],
    ['Lieu de prise en charge', b.depart],
    ['Destination', b.arrivee],
    ['Distance estimée', b.km ? String(b.km).replace('.', ',') + ' km' : '']
  ]);
  y = pdfSection(doc, y, 'Chauffeur et véhicule', [
    ['Chauffeur', issuer.name],
    ['Véhicule', vehicleLine(issuer)]
  ]);

  const pb = priceBreakdown(b, issuer);
  const rows = [];
  if(!pb) rows.push(['Prix', 'À confirmer par le chauffeur']);
  else if(pb.franchise){ rows.push(['Prix de la course', fmtMoney(pb.ttc)], ['TVA', 'Non applicable, article 293 B du CGI']); }
  else { rows.push(['Prix HT', fmtMoney(pb.ht)], ['TVA (10 %)', fmtMoney(pb.tva)], ['Prix TTC', fmtMoney(pb.ttc)]); }

// FACTURE (établie quand le chauffeur a terminé la course)
function buildInvoiceDoc(b){
  const issuer = issuerOf(b, 'invoice');
  const doc = pdfNew();
  let y = pdfHeader(doc, issuer, 'FACTURE', b.invoiceNo || '—', "Date d'émission :", fmtDateFR(b.invoiceDate));

  y = pdfSection(doc, y, 'Client', [
    ['Nom', b.name || '—'],
    ['Téléphone', b.phone],
    ['E-mail', b.email]
  ]);
  y = pdfSection(doc, y, 'Prestation', [
    ['Date de la prestation', fmtDateFR(b.date) + ' à ' + b.time],
    ["Catégorie d'opération", 'Prestation de services (transport de personnes)'],
    ['Références', 'Bon de commande n° ' + (b.orderNo || '—') + ' — réservation ' + b.id],
    ['Véhicule', vehicleLine(issuer)]
  ]);

  const pb = priceBreakdown(b, issuer);
  // Tableau
  doc.setFillColor(240); doc.rect(40, y - 11, 515, 18, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(20);
  doc.text('Désignation', 46, y);
  doc.text('Qté', 330, y, { align: 'center' });
  doc.text('PU HT', 400, y, { align: 'right' });
  doc.text('TVA', 455, y, { align: 'right' });
  doc.text('Total TTC', 549, y, { align: 'right' });
  y += 20;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(20);
  const desig = doc.splitTextToSize('Transport de personnes (VTC) : ' + b.depart + ' vers ' + b.arrivee, 250);
  doc.text(desig, 46, y);
  doc.text('1', 330, y, { align: 'center' });
  if(pb){
    doc.text(fmtMoney(pb.ht), 400, y, { align: 'right' });
    doc.text(pb.franchise ? '—' : pb.rate + ' %', 455, y, { align: 'right' });
    doc.text(fmtMoney(pb.ttc), 549, y, { align: 'right' });
  } else {
    doc.text('Montant non renseigné', 549, y, { align: 'right' });
  }
  y += Math.max(1, desig.length) * 12 + 6;
  doc.setDrawColor(210); doc.setLineWidth(0.6); doc.line(40, y, 555, y);
  y += 20;

  if(pb){
    const line = (label, value, bold) => {
      doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(bold ? 11 : 9.5); doc.setTextColor(20);
      doc.text(label, 400, y, { align: 'right' });
      doc.text(value, 549, y, { align: 'right' });
      y += bold ? 18 : 15;
    };
    line('Total HT', fmtMoney(pb.ht));
    line(pb.franchise ? 'TVA' : 'TVA (' + pb.rate + ' %)', pb.franchise ? 'non applicable' : fmtMoney(pb.tva));
    line('Total TTC — net à payer', fmtMoney(pb.ttc), true);
    y += 6;
    if(pb.franchise){
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(20);
      doc.text('TVA non applicable, article 293 B du CGI.', 40, y); y += 14;
    }
  }
  y = pdfSection(doc, y + 6, 'Règlement', [
    ['Conditions', "Paiement comptant, à bord à l'issue de la course (carte bancaire ou espèces)"]
  ]);
  pdfNote(doc, y,
    "Clients professionnels : en cas de retard de paiement, pénalités égales à trois fois le taux d'intérêt légal et indemnité forfaitaire " +
    "pour frais de recouvrement de 40 € (articles L. 441-10 et D. 441-5 du code de commerce). Pas d'escompte pour paiement anticipé.");
  return doc;
}

// Le chauffeur accepte : numéro de bon de commande attribué par le serveur, e-mail avec PDF, message WhatsApp prêt
async function acceptBooking(id){
  const b = state.bookings.find(x => x.id === id);
  if(!b) return false;
  if(APPS_SCRIPT_URL.includes('COLLEZ_ICI')){ alert(t('profileNotConfigured')); return false; }
  const row = await apiGet({ type: 'confirm', id });
  if(!row || row.error || !row.orderNo){ alert(t('acceptError')); return false; }
  Object.assign(b, mapRow(row));
  let emailSent = false;
  if(b.email){ try{ await sendOrderEmail(b); emailSent = true; }catch(e){} }
  state.acceptResult = { id, orderNo: b.orderNo, email: emailSent ? b.email : '', waUrl: clientWhatsappUrl(b) };
  return true;
}

async function completeBooking(b){
  if(APPS_SCRIPT_URL.includes('COLLEZ_ICI')) return false;
  const row = await apiGet({ type: 'complete', id: b.id });
  if(!row || row.error){ return false; }
  Object.assign(b, mapRow(row));
  return true;
}

function setupRevealObserver(){
  const els = document.querySelectorAll('.reveal:not(.in-view)');
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){
    els.forEach(el => el.classList.add('in-view'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  els.forEach(el => observer.observe(el));
}

      if(!state.tripDepart || !state.tripArrivee || HERE_API_KEY.includes('COLLEZ_ICI')) return;
      statusEl.textContent = t('searchCalculating');
      try{
        const result = (state.tripDepartCoords && state.tripArriveeCoords)
          ? await routeBetweenCoords(state.tripDepartCoords, state.tripArriveeCoords)
          : await calculateRoute(state.tripDepart, state.tripArrivee);
        state.tripKm = result.km;
        statusEl.textContent = '';
        updateEstimate();
      }catch(e){ statusEl.textContent = t('routeError'); }
    };

    const revealDepart = async () => {
      if(departWrap.style.display !== 'none') return;
      departWrap.style.display = 'block';
      departWrap.classList.add('expand-in');
      if(!state.tripDepart && navigator.geolocation && !HERE_API_KEY.includes('COLLEZ_ICI')){
        statusEl.textContent = t('searchLocating');
        try{
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 8000 });
          });
          state.tripDepart = await reverseGeocode(pos.coords.longitude, pos.coords.latitude);
          sDepart.value = state.tripDepart;
          statusEl.textContent = '';
          await tryCalcRoute();
        }catch(e){ statusEl.textContent = t('searchLocateFailed'); }
      }
    };

    dtPillBtn.onclick = () => {
      const opening = dtInputs.style.display === 'none';
      dtInputs.style.display = opening ? 'grid' : 'none';
      if(opening){ dtInputs.classList.add('expand-in'); revealDepart(); }
    };

    const refreshPillLabel = () => {
      state.tripDtCustomized = true;
      dtPillLabel.textContent = `${sDate.value} · ${sTime.value}`;
    };
    sDate.onchange = refreshPillLabel;
    sTime.onchange = refreshPillLabel;

    setupAutocomplete('s_arrivee', 's-arrivee-ac', (place) => {
      state.tripArrivee = place.address;
      state.tripArriveeCoords = place.coords;
      tryCalcRoute();
    });
    sArrivee.addEventListener('change', () => {
      if(sArrivee.value.trim() !== state.tripArrivee) state.tripArriveeCoords = null;
      state.tripArrivee = sArrivee.value.trim();
    });

    if(sDepart){
      setupAutocomplete('s_depart', 's-depart-ac', (place) => {
        state.tripDepart = place.address;
        state.tripDepartCoords = place.coords;
        tryCalcRoute();
      });
      sDepart.addEventListener('change', () => {
        if(sDepart.value.trim() !== state.tripDepart) state.tripDepartCoords = null;
        state.tripDepart = sDepart.value.trim();
        tryCalcRoute();
      });
      document.getElementById('locateBtn').onclick = () => {
        locateUser('s_depart', 'locateStatus', document.getElementById('locateBtn'), (address) => {
          state.tripDepart = address;
          state.tripDepartCoords = null; // adresse issue de la géolocalisation inverse, pas d'un choix de suggestion
          tryCalcRoute();
        });
      };
    }

    document.getElementById('searchNextBtn').onclick = async () => {
      const arrivee = sArrivee.value.trim();
      if(!arrivee){ statusEl.textContent = t('fillAlert'); return; }

      state.tripArrivee = arrivee;
      if(sDepart) state.tripDepart = sDepart.value.trim() || state.tripDepart;
      state.tripDate = sDate.value || state.tripDate;
      state.tripTime = sTime.value || state.tripTime;
      state.selectedDate = state.tripDate;

      if(!state.tripDepart && navigator.geolocation && !HERE_API_KEY.includes('COLLEZ_ICI')){
        statusEl.textContent = t('searchLocating');
        try{
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 8000 });
          });
          state.tripDepart = await reverseGeocode(pos.coords.longitude, pos.coords.latitude);
        }catch(e){
          statusEl.textContent = t('searchLocateFailed');
        }
      }

      if(!state.tripKm) await tryCalcRoute();

      state.bookingStep = 2;
      render();
    };
  }

  if(step === 2){
    const bbPrice = document.getElementById('bbPrice');
    const step2Price = document.getElementById('step2Price');
    const kmFallback = document.getElementById('f_km');

    const updatePrice = () => {
      const km = state.tripKm || (kmFallback ? kmFallback.value : '');
      const p = estimatePrice(km, null);
      const text = p ? `≈ ${p} €` : '— €';
      if(bbPrice) bbPrice.textContent = text;
      if(step2Price) step2Price.textContent = text;
    };
    updatePrice();
    if(kmFallback){ kmFallback.oninput = () => { state.tripKm = kmFallback.value; updatePrice(); }; }

    document.getElementById('editTripBtn').onclick = () => { state.bookingStep = 1; render(); };

    document.getElementById('submitBtn').onclick = async () => {
      const name = document.getElementById('f_name').value.trim();
      const time = state.tripTime;
      const phone = document.getElementById('f_phone').value.trim();
      const email = document.getElementById('f_email').value.trim();
      const depart = state.tripDepart;
      const arrivee = state.tripArrivee;
      const km = state.tripKm || (kmFallback ? kmFallback.value : '');
      if(!phone || !depart || !arrivee){ alert(t('fillAlert')); return; }
      if(!email){ alert(t('emailRequired')); return; }
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){ alert(t('emailInvalid')); return; }
      // Un numéro = une adresse e-mail, définitivement ; une adresse = un seul client
      if(!APPS_SCRIPT_URL.includes('COLLEZ_ICI')){
        const submitBtn = document.getElementById('submitBtn'); submitBtn.disabled = true;
        const chk = await fetchViaJsonp(`${APPS_SCRIPT_URL}?type=checkIdentity&phone=${encodeURIComponent(phone)}&email=${encodeURIComponent(email)}`);
        submitBtn.disabled = false;
        if(!chk){ alert(t('networkError')); return; }
        if(chk.error){ alert(chk.error === 'email_taken' ? t('errEmailTaken') : chk.error === 'phone_email_locked' ? t('errPhoneEmailLocked') : chk.error === 'invalid' ? t('emailInvalid') : t('networkError')); return; }
      }
      const price = estimatePrice(km, null);
      const booking = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        date: state.tripDate, time, name: name || null, phone, email: email.toLowerCase(), depart, arrivee,
        km: km || null, min: null, price: price || null,
        createdAt: new Date().toISOString()
      };
      state.bookings.push(booking);
      await postToSheet({ action: 'create', ...booking });

      const T = I18N[state.lang];
      const msg = `${T.waMsgIntro}%0A` +
        (name ? `${T.receiptName} : ${name}%0A` : '') +
        `${T.waDate} : ${state.tripDate}%0A${T.waTime} : ${time}%0A${T.waDepart} : ${depart}%0A${T.waArrivee} : ${arrivee}%0A${T.waPhone} : ${phone}` +
        (price ? `%0A${T.waEstimate} : ≈ ${price} €` : '');
      booking.waHref = `https://wa.me/${waNumber()}?text=${msg}`;
      state.lastBooking = booking;
      state.bookingStep = 3;
      state.tripArrivee = ''; state.tripDepart = ''; state.tripKm = ''; state.tripDtCustomized = false;
      render();
    };
  }

  if(step === 3){
    document.getElementById('backHomeBtn').onclick = () => {
      state.bookingOpen = false; state.bookingStep = 1; state.selectedDate = null; state.lastBooking = null; render();
    };
    document.getElementById('newBooking').onclick = () => {
      state.bookingStep = 1; state.selectedDate = null; state.lastBooking = null; render();
    };
  }
}


let trackRefreshInterval = null;

function stopTrackRefresh(){
  if(trackRefreshInterval){ clearInterval(trackRefreshInterval); trackRefreshInterval = null; }
  if(trackMapInstance){ try{ trackMapInstance.dispose(); }catch(e){} trackMapInstance = null; }
}

function isBookingPast(b){
  try{
    const dt = new Date(`${b.date}T${(b.time||'00:00')}:00`);
    return dt.getTime() < Date.now();
  }catch(e){ return false; }
}

async function refreshLiveTracking(booking){
  if(state.view !== 'track') return;
  const statEl = document.getElementById('trackStats');
  const waitEl = document.getElementById('trackWaitingMsg');
  const mapEl = document.getElementById('trackMap');

  // La carte ne s'affiche que si le chauffeur a démarré sa prise en charge (statut ≠ "pending")
  const status = booking.status || 'pending';
  if(status === 'pending' || status === 'confirmed'){
    if(waitEl){ waitEl.style.display = ''; waitEl.textContent = t(status === 'pending' ? 'trackWaitingConfirm' : 'trackWaitingLive'); }
    if(mapEl) mapEl.style.display = 'none';
    return;
  }

  try{
    const pos = await fetchDriverPosition();
    if(!pos){ if(waitEl){ waitEl.style.display = ''; waitEl.textContent = t('trackWaitingLive'); } if(mapEl) mapEl.style.display = 'none'; return; }
    const ageMin = (Date.now() - new Date(pos.updatedAt).getTime()) / 60000;
    if(ageMin > 30){ if(waitEl){ waitEl.style.display = ''; waitEl.textContent = t('trackWaitingLive'); } if(mapEl) mapEl.style.display = 'none'; return; }

    const targetAddress = status === 'in_progress' ? booking.arrivee : booking.depart;
    const targetCoord = await geocodeAddress(targetAddress);
    const driverCoord = [pos.lng, pos.lat];
    const route = await routeBetweenCoords(driverCoord, targetCoord);

    if(waitEl) waitEl.style.display = 'none';
    if(mapEl) mapEl.style.display = '';

    if(statEl){
      statEl.innerHTML = `
        <div class="stat"><div class="num">${route.km}</div><div class="lbl">${t('trackKmLeft')}</div></div>
        <div class="stat"><div class="num">${route.min}</div><div class="lbl">${t('trackMinLeft')}</div></div>
      `;
    }

    const lineString = H.geo.LineString.fromFlexiblePolyline(route.polyline);
    const driverPt = { lat: driverCoord[1], lng: driverCoord[0] };
    const targetPt = { lat: targetCoord[1], lng: targetCoord[0] };

    if(!trackMapInstance){
      const platform = new H.service.Platform({ apikey: HERE_API_KEY });
      const defaultLayers = platform.createDefaultLayers();
      trackMapInstance = new H.Map(document.getElementById('trackMap'), defaultLayers.vector.normal.map, {
        center: driverPt, zoom: 12, pixelRatio: window.devicePixelRatio || 1
      });
      new H.mapevents.Behavior(new H.mapevents.MapEvents(trackMapInstance));
      setTimeout(() => trackMapInstance && trackMapInstance.getViewPort().resize(), 150);

      trackMapInstance.routeLine = new H.map.Polyline(lineString, { style: { lineWidth: 5, strokeColor: '#F5C518' } });
      trackMapInstance.addObject(trackMapInstance.routeLine);
      trackMapInstance.targetMarker = new H.map.Marker(targetPt);
      trackMapInstance.addObject(trackMapInstance.targetMarker);
      trackMapInstance.driverMarker = new H.map.Marker(driverPt);
      trackMapInstance.addObject(trackMapInstance.driverMarker);
      trackMapInstance.getViewModel().setLookAtData({ bounds: lineString.getBoundingBox() });
    } else {
      trackMapInstance.getViewPort().resize();
      trackMapInstance.driverMarker.setGeometry(driverPt);
      trackMapInstance.routeLine.setGeometry(lineString);
      trackMapInstance.targetMarker.setGeometry(targetPt);
    }
  }catch(e){ if(waitEl){ waitEl.style.display = ''; } }
}

function renderStars(container, currentValue){
  container.innerHTML = [1,2,3,4,5].map(n =>
    `<span class="star ${n <= currentValue ? 'filled' : ''}" data-val="${n}">★</span>`
  ).join('');
}

function clientStageText(status){
  return ({
    pending: t('clientStagePending'),
    confirmed: t('clientStageConfirmed'),
    to_pickup: t('clientStageToPickup'),
    in_progress: t('clientStageInProgress'),
    completed: t('clientStageCompleted')
  })[status || 'pending'] || t('clientStagePending');
}

async function pollTrack(booking){
  if(state.view !== 'track') return;
  try{
    const rows = await apiGet({ type: 'bookings' });
    if(Array.isArray(rows)){
      const r = rows.find(x => String(x.id) === String(booking.id));
      if(r){
        const old = booking.status || 'pending';
        Object.assign(booking, mapRow(r));
        const ns = booking.status;
        if(ns === 'completed'){ stopTrackRefresh(); state.trackTab = 'details'; render(); return; }
        if(ns !== old){
          const pill = document.getElementById('trackStagePill');
          if(pill) pill.textContent = clientStageText(ns);
        }
      }
    }
  }catch(e){ /* on réessaiera au prochain cycle */ }
  refreshLiveTracking(booking);
}

  if(!state.session || state.session.role !== 'client' || !booking || normPhone(booking.phone) !== normPhone(state.session.phone)){
    state.view = 'account'; render(); return;
  }
  const completed = isBookingCompleted(booking);
  const tab = (completed || state.trackTab === 'details') ? 'details' : 'tracking';
  const goBack = () => { stopTrackRefresh(); state.view = 'account'; render(); };
  const p = driverProfile();

      waitEl.textContent = t('trackNotConfigured');
      return;
    }
    refreshLiveTracking(booking);
    trackRefreshInterval = setInterval(() => pollTrack(booking), 15000);
    return;
  }

  // Détails : fiche chauffeur, facture, note
  app.innerHTML = `
    <div class="container" style="padding-top:28px;">
      <div class="toprow" style="padding-top:0;">
        <h2>${completed ? t('rideDetailsTitle') : t('trackTitle')}</h2>

          ${renderLangSwitch()}

      </div>
      ${completed ? '' : `
      <div class="tabs" id="trackTabs">
        <button class="tab-btn" data-track-tab="tracking">${t('tabCourseTracking')}</button>
        <button class="tab-btn active" data-track-tab="details">${t('tabDriverInfo')}</button>
        <div class="tab-indicator" id="trackTabIndicator"></div>
      </div>`}
      <div class="card tab-panel" style="margin-top:16px;">${rideDetailsHTML(booking, completed)}</div>

  if(!completed){
    positionTabIndicator('trackTabs', 'trackTabIndicator');
    app.querySelectorAll('[data-track-tab]').forEach(btn => {
      btn.onclick = () => { state.trackTab = btn.dataset.trackTab; render(); };
    });
  }
  bindDocButtons(app);

  const starEl = document.getElementById('starRating');
  if(starEl){
    let selected = 0;
    const submitBtn = document.getElementById('submitRatingBtn');
    renderStars(starEl, 0);
    starEl.onclick = (e) => {
      const s = e.target.closest('.star');
      if(!s) return;
      selected = parseInt(s.dataset.val, 10);
      renderStars(starEl, selected);
      submitBtn.disabled = false;
    };
    submitBtn.onclick = async () => {
      if(!selected) return;
      await postToSheet({ action: 'rate', id: booking.id, rating: selected });
      booking.rating = selected;
      render();
    };
  }
}

        </div>`;

    <div class="container" style="padding-top:28px;">
      <div class="toprow" style="padding-top:0;">
        <h2>${t('clientLoginTitle')}</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          ${renderLangSwitch()}
          <button class="ghost-btn" id="back">${t('back')}</button>
        </div>
      </div>
      <div class="card" style="margin-top:18px;">
        ${step === 'code' ? codeHTML : phoneHTML}
        <div id="loginStatus" style="font-size:12.5px;color:var(--ink-dim);margin-top:10px;min-height:14px;"></div>
      </div>
    </div>`;
  bindLangSwitch();
  document.getElementById('back').onclick = () => { history.replaceState(null, '', window.location.pathname); state.loginStep = 'phone'; state.loginNotice = null; state.view = 'client'; render(); };
  const statusEl = document.getElementById('loginStatus');
  if(state.loginNotice){ statusEl.textContent = t(state.loginNotice); }

  const requestCode = async (phone) => {
    if(APPS_SCRIPT_URL.includes('COLLEZ_ICI')){ statusEl.textContent = t('trackNotConfigured'); return false; }
    state.loginNotice = null; statusEl.textContent = t('trackSearching');
    const res = await fetchViaJsonp(`${APPS_SCRIPT_URL}?type=clientCode&phone=${encodeURIComponent(phone)}&channel=${state.loginChannel === 'whatsapp' && state.waLogin ? 'whatsapp' : 'email'}`);
    if(!res || res.error){ statusEl.textContent = res && res.error === 'invalid_phone' ? t('invalidPhone') : t('networkError'); return false; }
    return true;
  };

  if(step === 'phone'){
    const input = document.getElementById('loginPhone');
    const go = async () => {
      const phone = input.value.trim();
      if(!phone) return;
      const chosen = document.querySelector('input[name="loginChannel"]:checked');
      state.loginChannel = chosen ? chosen.value : 'email';
      if(await requestCode(phone)){ state.loginPhone = phone; state.loginStep = 'code'; state.loginNotice = 'codeSentNotice'; renderClientLogin(); }
    };
    document.getElementById('clientLoginBtn').onclick = go;
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') go(); });
  } else {
    const codeInput = document.getElementById('loginCode');
    codeInput.focus();
    const verify = async () => {
      const code = codeInput.value.replace(/\D/g, '');
      if(code.length !== 6) return;
      state.loginNotice = null; statusEl.textContent = t('trackSearching');
      const res = await fetchViaJsonp(`${APPS_SCRIPT_URL}?type=clientVerify&phone=${encodeURIComponent(state.loginPhone)}&code=${encodeURIComponent(code)}`);
      if(!res || !res.token){ statusEl.textContent = !res ? t('networkError') : t('wrongCode'); return; }
      state.session = { role: 'client', phone: state.loginPhone, token: res.token };
      state.loginStep = 'phone';
      state.clientSection = 'reservations'; state.clientTab = 'upcoming'; state.clientProfileData = null;
      state.bookings = []; state.bookingsLoaded = false; state.view = 'account';
      render();
      await Promise.all([refreshBookings().catch(()=>{}), loadClientProfile()]);
      state.bookingsLoaded = true;
      if(!clientBookings().length){ state.session = null; state.loginStep = 'phone'; state.loginNotice = 'trackNoResults'; }
      render();
    };
    document.getElementById('clientCodeBtn').onclick = verify;
    codeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') verify(); });
    document.getElementById('resendCodeBtn').onclick = async () => { if(await requestCode(state.loginPhone)) statusEl.textContent = t('codeSentNotice'); };
    document.getElementById('changePhoneBtn').onclick = () => { state.loginStep = 'phone'; renderClientLogin(); };
  }
}

function setupThreeStageSlider(onComplete){
  const slideTrack = document.getElementById('courseSlideTrack');
  const slideFill = document.getElementById('courseSlideFill');
  const slideHandle = document.getElementById('courseSlideHandle');
  const handleSize = 48, margin = 3;
  let dragging = false, startX = 0;

  function setPos(x, animate){
    slideTrack.classList.toggle('snapping', !!animate);
    slideHandle.style.left = x + 'px';
    slideFill.style.width = (x + handleSize + margin) + 'px';
  }
  function reset(){ slideTrack.classList.remove('active'); setPos(margin, true); }
  setPos(margin, false);

  slideHandle.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX;
    slideTrack.classList.remove('snapping');
    slideHandle.setPointerCapture(e.pointerId);
  });
  slideHandle.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const maxLeft = slideTrack.offsetWidth - handleSize - margin;
    let newLeft = margin + (e.clientX - startX);
    newLeft = Math.max(margin, Math.min(maxLeft, newLeft));
    setPos(newLeft, false);
  });
  const endDrag = () => {
    if(!dragging) return;
    dragging = false;
    const maxLeft = slideTrack.offsetWidth - handleSize - margin;
    const current = parseFloat(slideHandle.style.left) || margin;
    if(current >= maxLeft * 0.82){
      setPos(maxLeft, true);
      slideTrack.classList.add('active');
      onComplete(reset);
    } else {
      reset();
    }
  };
  slideHandle.addEventListener('pointerup', endDrag);
  slideHandle.addEventListener('pointercancel', endDrag);
}

    return; // pas de carte/curseur à initialiser sur cet onglet
  }

  // Carte : position du chauffeur mise à jour en direct, SANS recréer la carte à chaque
  // position — on ne fait bouger que le marqueur et la ligne d'itinéraire.
  async function initOrUpdateCourseMap(driverCoord){
    try{
      const targetCoord = await geocodeAddress(targetAddress);
      const route = await routeBetweenCoords(driverCoord, targetCoord);
      const statsEl = document.getElementById('courseStats');
      if(statsEl){
        statsEl.innerHTML = `
          <div class="stat"><div class="num">${route.km}</div><div class="lbl">${t('trackKmLeft')}</div></div>
          <div class="stat"><div class="num">${route.min}</div><div class="lbl">${t('trackMinLeft')}</div></div>
        `;
      }
      const lineString = H.geo.LineString.fromFlexiblePolyline(route.polyline);
      const driverPt = { lat: driverCoord[1], lng: driverCoord[0] };
      const targetPt = { lat: targetCoord[1], lng: targetCoord[0] };

      if(!driverCourseMapInstance){
        const platform = new H.service.Platform({ apikey: HERE_API_KEY });
        const defaultLayers = platform.createDefaultLayers();
        driverCourseMapInstance = new H.Map(document.getElementById('courseMap'), defaultLayers.vector.normal.map, {
          center: driverPt, zoom: 12, pixelRatio: window.devicePixelRatio || 1
        });
        new H.mapevents.Behavior(new H.mapevents.MapEvents(driverCourseMapInstance));
        setTimeout(() => driverCourseMapInstance && driverCourseMapInstance.getViewPort().resize(), 150);

        driverCourseMapInstance.routeLine = new H.map.Polyline(lineString, { style: { lineWidth: 5, strokeColor: '#F5C518' } });
        driverCourseMapInstance.addObject(driverCourseMapInstance.routeLine);
        driverCourseMapInstance.addObject(new H.map.Marker(targetPt));
        driverCourseMapInstance.driverMarker = new H.map.Marker(driverPt);
        driverCourseMapInstance.addObject(driverCourseMapInstance.driverMarker);
        driverCourseMapInstance.getViewModel().setLookAtData({ bounds: lineString.getBoundingBox() });
      } else {
        driverCourseMapInstance.driverMarker.setGeometry(driverPt);
        driverCourseMapInstance.routeLine.setGeometry(lineString);
      }
    }catch(e){ /* géocodage/itinéraire indisponible pour le moment */ }
  }

  if(status !== 'completed' && !HERE_API_KEY.includes('COLLEZ_ICI')){
    if(navigator.geolocation){
      if(state.geoWatchId !== null){ navigator.geolocation.clearWatch(state.geoWatchId); state.geoWatchId = null; }
      state.geoWatchId = navigator.geolocation.watchPosition((pos) => {
        const coord = [pos.coords.longitude, pos.coords.latitude];
        postToSheet({ action: 'updatePosition', lat: pos.coords.latitude, lng: pos.coords.longitude, updatedAt: new Date().toISOString() });
        initOrUpdateCourseMap(coord);
      }, () => { /* localisation refusée : la carte restera vide */ }, { enableHighAccuracy: true, maximumAge: 8000, timeout: 15000 });
    }
  }

  if(status === 'completed') return;

  const nextStatusMap = { confirmed: 'to_pickup', to_pickup: 'in_progress', in_progress: 'completed' };

  setupThreeStageSlider(async (resetFn) => {
    const newStatus = nextStatusMap[status];
    booking.status = newStatus;
    if(newStatus === 'completed'){
      // le serveur attribue le numéro de facture (séquentiel, sans doublon)
      const ok = await completeBooking(booking);
      if(!ok){ await postToSheet({ action: 'updateStatus', id: booking.id, status: 'completed' }); }
    } else {
      await postToSheet({ action: 'updateStatus', id: booking.id, status: newStatus });
    }
    const statusEl = document.getElementById('courseSlideStatus');

    if(newStatus === 'completed'){
      if(state.geoWatchId !== null){ navigator.geolocation.clearWatch(state.geoWatchId); state.geoWatchId = null; }
      if(driverCourseMapInstance){ driverCourseMapInstance.dispose(); driverCourseMapInstance = null; }
      if(statusEl) statusEl.textContent = t('courseCompletedNote') + (booking.invoiceNo ? ' ' + t('invoiceIssued') + ' ' + booking.invoiceNo + '.' : '');
      setTimeout(() => { state.view = 'driver'; state.driverCourseId = null; state.driverTab = 'completed'; render(); }, 1800);
    } else {
      render();
    }
  });
}

function isBookingCompleted(b){
  if(b.status === 'completed') return true;
  try{
    const dt = new Date(`${b.date}T${(b.time||'00:00')}:00`);
    return (Date.now() - dt.getTime()) > 12 * 60 * 60 * 1000; // 12h passées
  }catch(e){ return false; }
}

// Redimensionne et recadre une photo (carré) dans le navigateur, puis la compresse pour tenir dans une cellule de la feuille
function resizePhoto(file, size){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const g = c.getContext('2d');
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
      g.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      let q = 0.85, out = c.toDataURL('image/jpeg', q);
      while(out.length > 30000 && q > 0.3){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      out.length > 30000 ? reject(new Error('too_big')) : resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad_image')); };
    img.src = url;
  });
}
function bindPhotoInputs(){
  const statusEl = document.getElementById('photoStatus');
  const save = async (key, value) => {
    if(APPS_SCRIPT_URL.includes('COLLEZ_ICI')){ statusEl.textContent = t('profileNotConfigured'); return; }
    statusEl.textContent = t('profileSaving');
    state.driverProfileData = Object.assign({}, state.driverProfileData || {}, { [key]: value });
    await postToSheet({ action: 'updatePhotos', [key]: value });
    statusEl.textContent = t('photoSaved');
    state.driverSection = 'infos'; render();
  };
  [['photo', 'pf_photoFile', 'pf_photoDel', 360], ['vehiclePhoto', 'pf_vehiclePhotoFile', 'pf_vehiclePhotoDel', 420]].forEach(([key, fileId, delId, size]) => {
    const input = document.getElementById(fileId);
    if(input) input.onchange = async () => {
      const f = input.files && input.files[0];
      if(!f) return;
      try{ await save(key, await resizePhoto(f, size)); }
      catch(e){ statusEl.textContent = t('photoError'); }
    };
    const del = document.getElementById(delId);
    if(del) del.onclick = () => save(key, '');
  });
}

function render(){
  const existingOverlay = document.getElementById('bookingOverlay');
  if(existingOverlay) existingOverlay.remove();
  const existingBar = document.getElementById('bottomBar');
  if(existingBar) existingBar.remove();

  if(state.view !== 'track') stopTrackRefresh();

  // Les espaces connectés ont besoin des réservations : on attend leur chargement
  const needsData = state.session && ['driver','driver-course','account','track'].includes(state.view);
  if(needsData && !state.bookingsLoaded){
    renderLoading();
    writeSession();
    return;
  }

  if(state.view === 'client') renderClient();
  else if(state.view === 'track') renderTrack();
  else if(state.view === 'account') renderAccount();
  else if(state.view === 'driver-login') renderDriverLogin();
  else if(state.view === 'driver') renderDriver();
  else if(state.view === 'driver-course') renderDriverCourse();

  writeSession();
}

function checkSecretAccess(){
  if(window.location.hash.toLowerCase() === '#admin'){
    state.view = (state.session && state.session.role === 'driver') ? 'driver' : 'driver-login';
  }
}

// Une seule écoute du redimensionnement pour les deux cartes
window.addEventListener('resize', () => {
  if(trackMapInstance) trackMapInstance.getViewPort().resize();
  if(driverCourseMapInstance) driverCourseMapInstance.getViewPort().resize();
});

restoreLang();
restoreSession();
checkSecretAccess();
render();          // affichage immédiat (page d'accueil, ou écran de chargement si connecté)
loadBookings();    // puis chargement des réservations depuis la feuille
loadDriverProfile().then(rerenderIfIdle);
loadConfig().then(() => { if(state.view === 'account' && !state.session) renderClientLogin(); });
if(state.session && state.session.role === 'client') loadClientProfile().then(rerenderIfIdle);
</script>
</body>
</html>
